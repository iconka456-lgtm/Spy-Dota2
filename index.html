    :root {
      --bg: #101010;
      --card: #1d1d1f;
      --card2: #151515;
      --line: #3a3a3a;
      --text: #ffffff;
      --muted: #aaaaaa;
      --green: #76e5a2;
      --yellow: #ffd166;
      --red: #ff7b7b;
      --blue: #7ec8ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .wrap {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 18px 14px calc(36px + env(safe-area-inset-bottom));
    }

    h1 {
      margin: 8px 0 18px;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    p {
      line-height: 1.45;
    }

    .card {
      margin: 12px 0;
      padding: 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      color: #111;
      background: #ffffff;
      font-weight: 700;
    }

    .btn.alt {
      color: #ffffff;
      background: #303035;
    }

    .btn.danger {
      color: #ffffff;
      background: #a83131;
    }

    .btn.yellow {
      color: #211700;
      background: var(--yellow);
    }

    .btn.blue {
      color: #071925;
      background: var(--blue);
    }

    .btn:disabled {
      cursor: default;
      opacity: 0.45;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #d0d0d0;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      color: #ffffff;
      background: #111111;
      border: 1px solid #4a4a4a;
      border-radius: 12px;
      outline: none;
    }

    .main-mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .main-mode-button {
      min-height: 145px;
      padding: 16px 10px;
      color: #ffffff;
      background: var(--card2);
      border: 2px solid #45454b;
      border-radius: 18px;
      font-weight: 700;
      text-align: center;
    }

    .main-mode-button.full-width {
      grid-column: 1 / -1;
      min-height: 130px;
    }

    .main-mode-button.selected {
      border-color: var(--yellow);
      background: #332d19;
    }

    .main-mode-icon {
      display: block;
      margin-bottom: 9px;
      font-size: 44px;
    }

    .main-mode-subtitle {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
    }

    .mode-card {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #45454a;
      border-radius: 14px;
      background: var(--card2);
    }

    .player-number {
      margin: 12px 0 16px;
      color: var(--yellow);
      font-size: 32px;
      font-weight: 800;
      text-align: center;
    }

    .secret-button {
      width: 100%;
      min-height: 145px;
      margin-top: 12px;
      padding: 18px;
      color: #ffffff;
      background: #35353a;
      border: 2px solid #53535a;
      border-radius: 18px;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.4;
      user-select: none;
      touch-action: none;
    }

    .secret-button.open-peaceful {
      color: #06180d;
      background: var(--green);
      border-color: #b2ffd0;
    }

    .secret-button.open-spy {
      color: #211700;
      background: var(--yellow);
      border-color: #ffe39b;
    }

    .timer {
      margin: 18px 0;
      color: var(--green);
      font-size: 56px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .timer.finished {
      color: var(--red);
    }

    .result {
      padding: 16px;
      text-align: center;
      background: var(--card2);
      border-radius: 14px;
    }

    .role-icon {
      margin: 8px 0;
      font-size: 58px;
      text-align: center;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .choice-button {
      min-height: 130px;
      padding: 14px 8px;
      color: #ffffff;
      background: var(--card2);
      border: 2px solid #45454b;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
    }

    .choice-button.selected {
      border-color: var(--blue);
      background: #162c3c;
    }

    .guess-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 14px;
    }

    .guess-card {
      position: relative;
      min-height: 125px;
      overflow: hidden;
      padding: 7px;
      color: #ffffff;
      background: #111111;
      border: 2px solid #46464c;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .guess-card:active {
      transform: scale(0.98);
    }

    .guess-card.crossed {
      opacity: 0.32;
      border-color: #8a3333;
    }

    .guess-card.crossed::before,
    .guess-card.crossed::after {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: -15%;
      width: 130%;
      height: 5px;
      content: "";
      background: var(--red);
      border-radius: 99px;
      pointer-events: none;
    }

    .guess-card.crossed::before {
      transform: rotate(35deg);
    }

    .guess-card.crossed::after {
      transform: rotate(-35deg);
    }

    .guess-image {
      display: block;
      width: 100%;
      height: 80px;
      margin-bottom: 6px;
      object-fit: cover;
      border-radius: 9px;
      background: #252525;
    }

    .guess-card.item .guess-image {
      object-fit: contain;
      padding: 8px;
    }

    .guess-name {
      display: block;
      line-height: 1.18;
    }

    .guess-status {
      margin: 12px 0;
      padding: 12px;
      color: #d8ecff;
      background: #112635;
      border: 1px solid #28516b;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    .selected-secret {
      border-color: var(--yellow);
      background: #332d19;
    }

    .secret-preview-image {
      display: block;
      width: 150px;
      height: 100px;
      margin: 12px auto;
      object-fit: cover;
      border-radius: 12px;
      background: #111;
    }

    .secret-preview-image.item-image {
      object-fit: contain;
      padding: 12px;
    }

    .error-box {
      margin: 20px;
      padding: 16px;
      color: #ffffff;
      background: #3b1717;
      border: 1px solid #f07a7a;
      border-radius: 15px;
    }

    @media (max-width: 360px) {
      .guess-grid {
        gap: 7px;
      }

      .guess-card {
        min-height: 112px;
        font-size: 11px;
      }

      .guess-image {
        height: 68px;
      }
    }
  </style>
</head>

    function randomItem(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function shuffle(list) {
      var result = list.slice();

      for (var i = result.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = result[i];
        result[i] = result[j];
        result[j] = temp;
      }

      return result;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function haptic(type) {
      try {
        var tg = window.Telegram && window.Telegram.WebApp;

        if (!tg || !tg.HapticFeedback) {
          return;
        }

        if (type === "success") {
          tg.HapticFeedback.notificationOccurred("success");
        } else if (type === "error") {
          tg.HapticFeedback.notificationOccurred("error");
        } else {
          tg.HapticFeedback.impactOccurred("medium");
        }
      } catch (error) {
        console.log(error);
      }
    }

        ".png";
    }

    function getImage(object, type) {
      return type === "heroes" ? heroImage(object) : itemImage(object);
