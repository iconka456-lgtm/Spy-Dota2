    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, select { font: inherit; }

      border-radius: 18px;
    }

    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .ok { color: var(--green); }
    .warn { color: var(--yellow); }
    .error {
      color: var(--red);
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .hidden { display: none !important; }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      color: #111;
      background: #fff;
      font-weight: 700;

      background: #2b2b2f;
    }

    .btn.danger {

      background: #a83131;
    }

    .btn:disabled {

      opacity: .45;
    }

    label {
      display: block;
      margin: 11px 0 5px;
      color: #c6c6c6;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      color: #fff;
      background: #101010;
      border: 1px solid #444;
      border-radius: 12px;
      outline: none;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .code {
      margin: 12px 0 18px;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 6px;
      text-align: center;
    }

    .status {

      color: #b8b8b8;
      background: var(--card2);
      border-radius: 12px;
      line-height: 1.4;
    }

    .players {

    }

    .player {

      border-radius: 12px;

    .hero-image {

      height: 107px;

    .role {

    .secret {
