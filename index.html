<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Dota 2 Spy</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    :root {
      --bg: #101010;
      --card: #1d1d1f;
      --card2: #151515;
      --line: #3a3a3a;
      --text: #ffffff;
      --muted: #aaaaaa;
      --green: #76e5a2;
      --yellow: #ffd166;
      --red: #ff7b7b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .wrap {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 18px 14px calc(36px + env(safe-area-inset-bottom));
    }

    h1 {
      margin: 8px 0 18px;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    p {
      line-height: 1.45;
    }

    .card {
      margin: 12px 0;
      padding: 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      color: #111;
      background: #fff;
      font-weight: 700;
    }

    .btn.alt {
      color: #fff;
      background: #303035;
    }

    .btn.danger {
      color: #fff;
      background: #a83131;
    }

    .btn.yellow {
      color: #211700;
      background: var(--yellow);
    }

    .btn:disabled {
      cursor: default;
      opacity: 0.45;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #d0d0d0;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      color: #fff;
      background: #111;
      border: 1px solid #4a4a4a;
      border-radius: 12px;
      outline: none;
    }

    .player-number {
      margin: 12px 0 16px;
      color: var(--yellow);
      font-size: 32px;
      font-weight: 800;
      text-align: center;
    }

    .secret-button {
      width: 100%;
      min-height: 135px;
      margin-top: 12px;
      padding: 18px;
      color: #fff;
      background: #35353a;
      border: 2px solid #53535a;
      border-radius: 18px;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.4;
      user-select: none;
      touch-action: none;
    }

    .secret-button.open {
      color: #1f1700;
      background: var(--yellow);
      border-color: #ffe39b;
    }

    .timer {
      margin: 20px 0;
      color: var(--green);
      font-size: 58px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .timer.finished {
      color: var(--red);
    }

    .result {
      padding: 16px;
      text-align: center;
      background: var(--card2);
      border-radius: 14px;
    }

    .role-icon {
      margin: 8px 0;
      font-size: 64px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const app = document.getElementById("app");

    const heroes = [
      "Abaddon", "Alchemist", "Ancient Apparition", "Anti-Mage",
      "Axe", "Bane", "Batrider", "Beastmaster", "Bloodseeker",
      "Bounty Hunter", "Bristleback", "Broodmother", "Chaos Knight",
      "Clinkz", "Clockwerk", "Crystal Maiden", "Dazzle", "Doom",
      "Dragon Knight", "Drow Ranger", "Earthshaker", "Ember Spirit",
      "Enchantress", "Enigma", "Faceless Void", "Gyrocopter", "Huskar",
      "Invoker", "Jakiro", "Juggernaut", "Kunkka", "Legion Commander",
      "Lich", "Lifestealer", "Lina", "Lion", "Luna", "Magnus", "Mars",
      "Medusa", "Meepo", "Mirana", "Monkey King", "Morphling", "Muerta",
      "Naga Siren", "Nature's Prophet", "Necrophos", "Night Stalker",
      "Nyx Assassin", "Ogre Magi", "Omniknight", "Oracle", "Pangolier",
      "Phantom Assassin", "Phantom Lancer", "Phoenix", "Puck", "Pudge",
      "Pugna", "Queen of Pain", "Razor", "Riki", "Rubick", "Sand King",
      "Shadow Demon", "Shadow Fiend", "Shadow Shaman", "Silencer",
      "Skywrath Mage", "Slardar", "Slark", "Snapfire", "Sniper",
      "Spectre", "Spirit Breaker", "Storm Spirit", "Sven", "Techies",
      "Templar Assassin", "Terrorblade", "Tidehunter", "Tinker", "Tiny",
      "Treant Protector", "Troll Warlord", "Tusk", "Undying", "Ursa",
      "Venomancer", "Viper", "Visage", "Void Spirit", "Warlock", "Weaver",
      "Windranger", "Winter Wyvern", "Witch Doctor", "Wraith King", "Zeus"
    ];

    const locations = [
      "Таверна",
      "Рошанова яма",
      "Мид-лейн",
      "Лес Radiant",
      "Лес Dire",
      "Фонтан Radiant",
      "Фонтан Dire",
      "Секретный магазин",
      "Лагерь Древних"
    ];

    let game = null;
    let timerId = null;

    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (error) {
      console.log("Telegram API не подключён", error);
    }

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function shuffle(items) {
      const result = items.slice();

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = result[i];
        result[i] = result[j];
        result[j] = temp;
      }

      return result;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function haptic() {
      try {
        const tg = window.Telegram.WebApp;

        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred("medium");
        }
      } catch (error) {
        console.log(error);
      }
    }

    function renderHome() {
      clearInterval(timerId);

      app.innerHTML = `
        <div class="wrap">
          <h1>🕵️ Dota 2 Spy</h1>

          <div class="card">
            <h2>Игра на одном устройстве</h2>
            <p class="muted">
              Настрой количество игроков, раздай роли по очереди и передавай телефон.
            </p>

            <label for="players">Количество игроков</label>
            <input id="players" type="number" min="3" max="20" value="5">

            <label for="spies">Количество шпионов</label>
            <input id="spies" type="number" min="1" max="5" value="1">

            <label for="minutes">Время игры в минутах</label>
            <input id="minutes" type="number" min="1" max="60" value="8">

            <button class="btn" id="startSetup">🎮 Начать раздачу ролей</button>
          </div>

          <div class="card">
            <h2>Как играть</h2>
            <p class="muted small">
              Игрок удерживает кнопку, запоминает роль, отпускает кнопку и передаёт телефон следующему.
              Обычные игроки знают героя и локацию. Шпион знает только то, что он шпион.
            </p>
          </div>
        </div>
      `;

      document.getElementById("startSetup").addEventListener("click", createGame);
    }

    function createGame() {
      const playersInput = Number(document.getElementById("players").value);
      const spiesInput = Number(document.getElementById("spies").value);
      const minutesInput = Number(document.getElementById("minutes").value);

      const playersCount = Math.max(3, Math.min(20, playersInput || 5));
      const spiesCount = Math.max(1, Math.min(playersCount - 1, spiesInput || 1));
      const minutes = Math.max(1, Math.min(60, minutesInput || 8));

      const indexes = [];

      for (let i = 0; i < playersCount; i++) {
        indexes.push(i);
      }

      const spyIndexes = shuffle(indexes).slice(0, spiesCount);

      game = {
        playersCount: playersCount,
        spiesCount: spiesCount,
        minutes: minutes,
        hero: randomItem(heroes),
        location: randomItem(locations),
        spyIndexes: spyIndexes,
        currentPlayer: 0
      };

      haptic();
      renderRoleScreen();
    }

    function renderRoleScreen() {
      const playerNumber = game.currentPlayer + 1;
      const isSpy = game.spyIndexes.includes(game.currentPlayer);
      const isLast = playerNumber === game.playersCount;

      app.innerHTML = `
        <div class="wrap">
          <h1>🕵️ Раздача ролей</h1>

          <div class="card">
            <div class="player-number">Игрок ${playerNumber}</div>

            <p class="muted" style="text-align:center">
              Остальные игроки не должны смотреть на экран.
            </p>

            <button id="roleButton" class="secret-button">
              Нажми и удерживай,<br>чтобы увидеть роль
            </button>

            <p class="muted small" style="text-align:center">
              Отпусти кнопку, когда запомнишь роль.
            </p>

            <button id="nextButton" class="btn alt" disabled>
              ${isLast ? "🚀 Начать игру" : "Передать игроку " + (playerNumber + 1)}
            </button>
          </div>

          <button id="cancelButton" class="btn danger">Отменить игру</button>
        </div>
      `;

      const roleButton = document.getElementById("roleButton");
      const nextButton = document.getElementById("nextButton");
      let roleWasShown = false;

      function showRole() {
        roleButton.classList.add("open");

        if (isSpy) {
          roleButton.innerHTML = "🕵️<br>ТЫ ШПИОН";
        } else {
          roleButton.innerHTML =
            "🛡️<br>" +
            escapeHtml(game.hero) +
            "<br><span style='font-size:15px'>Локация: " +
            escapeHtml(game.location) +
            "</span>";
        }

        haptic();
      }

      function hideRole() {
        roleButton.classList.remove("open");
        roleButton.innerHTML = "Нажми и удерживай,<br>чтобы увидеть роль";
        roleWasShown = true;
        nextButton.disabled = false;
      }

      roleButton.addEventListener("pointerdown", function(event) {
        event.preventDefault();
        showRole();
      });

      roleButton.addEventListener("pointerup", function(event) {
        event.preventDefault();
        hideRole();
      });

      roleButton.addEventListener("pointerleave", hideRole);
      roleButton.addEventListener("pointercancel", hideRole);

      nextButton.addEventListener("click", function() {
        if (!roleWasShown) {
          return;
        }

        if (game.currentPlayer < game.playersCount - 1) {
          game.currentPlayer += 1;
          renderRoleScreen();
        } else {
          renderGameScreen();
        }
      });

      document.getElementById("cancelButton").addEventListener("click", function() {
        game = null;
        renderHome();
      });
    }

    function renderGameScreen() {
      const totalSeconds = game.minutes * 60;

      app.innerHTML = `
        <div class="wrap">
          <h1>🕵️ Игра началась</h1>

          <div class="card">
            <h2>Обсуждение</h2>
            <p class="muted">
              Задавайте вопросы друг другу. Не называйте героя и локацию прямо.
            </p>

            <div id="timer" class="timer">${formatTime(totalSeconds)}</div>

            <button id="timerButton" class="btn">▶️ Запустить таймер</button>
            <button id="finishButton" class="btn yellow">🏁 Закончить раунд</button>
          </div>

          <button id="cancelButton" class="btn danger">Отменить игру</button>
        </div>
      `;

      let seconds = totalSeconds;
      let running = false;

      const timer = document.getElementById("timer");
      const timerButton = document.getElementById("timerButton");

      timerButton.addEventListener("click", function() {
        if (running) {
          clearInterval(timerId);
          running = false;
          timerButton.textContent = "▶️ Продолжить таймер";
          return;
        }

        running = true;
        timerButton.textContent = "⏸️ Пауза";

        timerId = setInterval(function() {
          seconds -= 1;
          timer.textContent = formatTime(seconds);

          if (seconds <= 0) {
            clearInterval(timerId);
            timer.classList.add("finished");
            timerButton.disabled = true;
            haptic();

            setTimeout(function() {
              alert("Время вышло! Выберите предполагаемого шпиона.");
            }, 100);
          }
        }, 1000);
      });

      document.getElementById("finishButton").addEventListener("click", function() {
        clearInterval(timerId);
        renderResultScreen();
      });

      document.getElementById("cancelButton").addEventListener("click", function() {
        clearInterval(timerId);
        game = null;
        renderHome();
      });
    }

    function renderResultScreen() {
      const spies = game.spyIndexes
        .map(function(index) {
          return "Игрок " + (index + 1);
        })
        .join(", ");

      app.innerHTML = `
        <div class="wrap">
          <h1>🕵️ Итоги раунда</h1>

          <div class="card">
            <h2>Герой и локация</h2>
            <div class="result">
              <div class="role-icon">🛡️</div>
              <h2>${escapeHtml(game.hero)}</h2>
              <p>Локация: <b>${escapeHtml(game.location)}</b></p>
            </div>
          </div>

          <div class="card">
            <h2>Шпионы</h2>
            <div class="result">
              <div class="role-icon">🕵️</div>
              <p><b>${spies}</b></p>
            </div>
          </div>

          <button id="newGameButton" class="btn">🔄 Новая игра</button>
          <button id="settingsButton" class="btn alt">⚙️ К настройкам</button>
        </div>
      `;

      document.getElementById("newGameButton").addEventListener("click", function() {
        renderHome();
      });

      document.getElementById("settingsButton").addEventListener("click", function() {
        game = null;
        renderHome();
      });
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const restSeconds = seconds % 60;

      return String(minutes).padStart(2, "0") +
        ":" +
        String(restSeconds).padStart(2, "0");
    }

    renderHome();
  </script>
</body>
</html>
