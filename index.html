    :root {
      --bg: #101010;
      --card: #1d1d1f;
      --card2: #151515;
      --line: #3a3a3a;
      --text: #ffffff;
      --muted: #aaaaaa;
      --green: #76e5a2;
      --yellow: #ffd166;
      --red: #ff7b7b;
      --blue: #7ec8ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .wrap {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 18px 14px calc(36px + env(safe-area-inset-bottom));
    }

    h1 {
      margin: 8px 0 18px;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    p {
      line-height: 1.45;
    }

    .card {
      margin: 12px 0;
      padding: 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      color: #111;
      background: #ffffff;
      font-weight: 700;
    }

    .btn.alt {
      color: #ffffff;
      background: #303035;
    }

    .btn.danger {
      color: #ffffff;
      background: #a83131;
    }

    .btn.yellow {
      color: #211700;
      background: var(--yellow);
    }

    .btn.blue {
      color: #071925;
      background: var(--blue);
    }

    .btn:disabled {
      cursor: default;
      opacity: 0.45;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #d0d0d0;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      color: #ffffff;
      background: #111111;
      border: 1px solid #4a4a4a;
      border-radius: 12px;
      outline: none;
    }

    .main-mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .main-mode-button {
      min-height: 145px;
      padding: 16px 10px;
      color: #ffffff;
      background: var(--card2);
      border: 2px solid #45454b;
      border-radius: 18px;
      font-weight: 700;
      text-align: center;
    }

    .main-mode-button.full-width {
      grid-column: 1 / -1;
      min-height: 130px;
    }

    .main-mode-button.selected {
      border-color: var(--yellow);
      background: #332d19;
    }

    .main-mode-icon {
      display: block;
      margin-bottom: 9px;
      font-size: 44px;
    }

    .main-mode-subtitle {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
    }

    .mode-card {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #45454a;
      border-radius: 14px;
      background: var(--card2);
    }

    .player-number {
      margin: 12px 0 16px;
      color: var(--yellow);
      font-size: 32px;
      font-weight: 800;
      text-align: center;
    }

    .secret-button {
      width: 100%;
      min-height: 145px;
      margin-top: 12px;
      padding: 18px;
      color: #ffffff;
      background: #35353a;
      border: 2px solid #53535a;
      border-radius: 18px;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.4;
      user-select: none;
      touch-action: none;
    }

    .secret-button.open-peaceful {
      color: #06180d;
      background: var(--green);
      border-color: #b2ffd0;
    }

    .secret-button.open-spy {
      color: #211700;
      background: var(--yellow);
      border-color: #ffe39b;
    }

    .timer {
      margin: 18px 0;
      color: var(--green);
      font-size: 56px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .timer.finished {
      color: var(--red);
    }

    .result {
      padding: 16px;
      text-align: center;
      background: var(--card2);
      border-radius: 14px;
    }

    .role-icon {
      margin: 8px 0;
      font-size: 58px;
      text-align: center;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .choice-button {
      min-height: 130px;
      padding: 14px 8px;
      color: #ffffff;
      background: var(--card2);
      border: 2px solid #45454b;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
    }

    .choice-button.selected {
      border-color: var(--blue);
      background: #162c3c;
    }

    .guess-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 14px;
    }

    .guess-card {
      position: relative;
      min-height: 125px;
      overflow: hidden;
      padding: 7px;
      color: #ffffff;
      background: #111111;
      border: 2px solid #46464c;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .guess-card:active {
      transform: scale(0.98);
    }

    .guess-card.crossed {
      opacity: 0.32;
      border-color: #8a3333;
    }

    .guess-card.crossed::before,
    .guess-card.crossed::after {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: -15%;
      width: 130%;
      height: 5px;
      content: "";
      background: var(--red);
      border-radius: 99px;
      pointer-events: none;
    }

    .guess-card.crossed::before {
      transform: rotate(35deg);
    }

    .guess-card.crossed::after {
      transform: rotate(-35deg);
    }

    .guess-image {
      display: block;
      width: 100%;
      height: 80px;
      margin-bottom: 6px;
      object-fit: cover;
      border-radius: 9px;
      background: #252525;
    }

    .guess-card.item .guess-image {
      object-fit: contain;
      padding: 8px;
    }

    .guess-name {
      display: block;
      line-height: 1.18;
    }

    .guess-status {
      margin: 12px 0;
      padding: 12px;
      color: #d8ecff;
      background: #112635;
      border: 1px solid #28516b;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    .selected-secret {
      border-color: var(--yellow);
      background: #332d19;
    }

    .secret-preview-image {
      display: block;
      width: 150px;
      height: 100px;
      margin: 12px auto;
      object-fit: cover;
      border-radius: 12px;
      background: #111;
    }

    .secret-preview-image.item-image {
      object-fit: contain;
      padding: 12px;
    }

    .error-box {
      margin: 20px;
      padding: 16px;
      color: #ffffff;
      background: #3b1717;
      border: 1px solid #f07a7a;
      border-radius: 15px;
    }

    @media (max-width: 360px) {
      .guess-grid {
        gap: 7px;
      }

      .guess-card {
        min-height: 112px;
        font-size: 11px;
      }

      .guess-image {
        height: 68px;
      }
    }
  </style>
</head>

    function randomItem(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function shuffle(list) {
      var result = list.slice();

      for (var i = result.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = result[i];
        result[i] = result[j];
        result[j] = temp;
      }

      return result;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function haptic(type) {
      try {
        var tg = window.Telegram && window.Telegram.WebApp;

        if (!tg || !tg.HapticFeedback) {
          return;
        }

        if (type === "success") {
          tg.HapticFeedback.notificationOccurred("success");
        } else if (type === "error") {
          tg.HapticFeedback.notificationOccurred("error");
        } else {
          tg.HapticFeedback.impactOccurred("medium");
        }
      } catch (error) {
        console.log(error);
      }
    }

        ".png";
    }

    function getImage(object, type) {
      return type === "heroes" ? heroImage(object) : itemImage(object);

      document.getElementById("spyItemsButton").classList.toggle(
        "selected",

        hostSettings.innerHTML = "";
        hostSettings.classList.add("hidden");

    function createSpyGame() {
      var playersInput = Number(document.getElementById("playersCount").value);
      var spiesInput = Number(document.getElementById("spiesCount").value);
      var minutesInput = Number(document.getElementById("minutesCount").value);

      var playersCount = Math.max(3, Math.min(20, playersInput || 5));
      var spiesCount = Math.max(1, Math.min(playersCount - 1, spiesInput || 1));
      var minutes = Math.max(1, Math.min(60, minutesInput || 8));

      var peacefulAnswer;
      var spyAnswer;
      var location = "";

      if (selectedSpyType === "heroes") {
        if (selectedSpyMode === "host") {
          peacefulAnswer = document.getElementById("peacefulHero").value;
          spyAnswer = document.getElementById("spyHero").value;
          location = document.getElementById("locationSelect").value;

          if (peacefulAnswer === spyAnswer) {
            alert("Выбери разных героев для мирных и шпионов.");
            return;
          }
        } else {
          peacefulAnswer = randomItem(heroes).name;

          do {
            spyAnswer = randomItem(heroes).name;
          } while (spyAnswer === peacefulAnswer);

          location = randomItem(locations);
        }
      } else {
        if (selectedSpyMode === "host") {
          if (!hostPeacefulChoice || !hostSpyChoice) {
            alert("Выбери предмет мирных и предмет шпионов.");
            return;
          }

          if (hostPeacefulChoice.slug === hostSpyChoice.slug) {
            alert("Для мирных и шпионов выбери разные предметы.");
            return;
          }

          peacefulAnswer = hostPeacefulChoice;
          spyAnswer = hostSpyChoice;
        } else {
          peacefulAnswer = randomItem(items);

          do {
            spyAnswer = randomItem(items);
          } while (spyAnswer.slug === peacefulAnswer.slug);
        }
      }

      var playerIndexes = [];

      for (var i = 0; i < playersCount; i++) {
        playerIndexes.push(i);
      }

      spyGame = {
        type: selectedSpyType,
        timerMode: selectedTimerMode,
        playersCount: playersCount,
        minutes: minutes,
        peacefulAnswer: peacefulAnswer,
        spyAnswer: spyAnswer,
        location: location,
        spyIndexes: shuffle(playerIndexes).slice(0, spiesCount),
        currentPlayer: 0
      };

      haptic("success");
      renderSpyRoleScreen();
    }

    function renderSpyRoleScreen() {
      var playerNumber = spyGame.currentPlayer + 1;
      var isSpy = spyGame.spyIndexes.indexOf(spyGame.currentPlayer) !== -1;
      var isLast = playerNumber === spyGame.playersCount;

      app.innerHTML = `
        <div class="wrap">
          <h1>🕵️ Dota2SpyForSolin</h1>

          <div class="card">
            <div class="player-number">Игрок ${playerNumber}</div>

              ${isLast ? "🚀 Начать игру" : "Передать игроку " + (playerNumber + 1)}
            </button>

        </div>
      `;

      var roleButton = document.getElementById("roleButton");
      var nextButton = document.getElementById("nextButton");
      var roleVisible = false;
      var roleWasShown = false;

      function showRole() {
        if (roleVisible) {
          return;
        }

        roleVisible = true;
        roleWasShown = true;

        roleButton.classList.add(isSpy ? "open-spy" : "open-peaceful");

        if (spyGame.type === "heroes") {
          if (isSpy) {
            roleButton.innerHTML =
              "🕵️<br>ТЫ ШПИОН<br>" +
              "<span style='font-size:15px'>Твой герой: " +
              escapeHtml(spyGame.spyAnswer) +
              "</span><br>" +
              "<span style='font-size:15px'>Локация: " +
              escapeHtml(spyGame.location) +
              "</span>";
          } else {
            roleButton.innerHTML =
              "🛡️<br>ТЫ МИРНЫЙ<br>" +
              "<span style='font-size:15px'>Твой герой: " +
              escapeHtml(spyGame.peacefulAnswer) +
              "</span><br>" +
              "<span style='font-size:15px'>Локация: " +
              escapeHtml(spyGame.location) +
              "</span>";
          }
        } else {
          var answer = isSpy ? spyGame.spyAnswer : spyGame.peacefulAnswer;

          roleButton.innerHTML =
            (isSpy ? "🕵️<br>ТЫ ШПИОН" : "🛡️<br>ТЫ МИРНЫЙ") +
            "<br><span style='font-size:15px'>Предмет: " +
            escapeHtml(answer.name) +
            "</span>";
        }

        haptic("impact");
      }

      function hideRole() {
        if (!roleVisible) {
          return;
        }

        roleVisible = false;
        roleButton.classList.remove("open-peaceful");
        roleButton.classList.remove("open-spy");
        roleButton.innerHTML = "Нажми и удерживай,<br>чтобы увидеть роль";
        nextButton.disabled = false;
      }

      roleButton.addEventListener("pointerdown", function(event) {
        event.preventDefault();
        showRole();
      });

      roleButton.addEventListener("pointerup", function(event) {
        event.preventDefault();
        hideRole();
      });

      roleButton.addEventListener("pointerleave", hideRole);
      roleButton.addEventListener("pointercancel", hideRole);

      nextButton.addEventListener("click", function() {
        if (!roleWasShown) {
          return;
        }

        if (spyGame.currentPlayer < spyGame.playersCount - 1) {
          spyGame.currentPlayer += 1;
          renderSpyRoleScreen();
        } else {
          renderSpyGameScreen();
        }
      });

      document.getElementById("cancelSpyButton").addEventListener("click", renderHome);
    }

    function renderSpyGameScreen() {
      var hasTimer = spyGame.timerMode === "withTime";

      app.innerHTML = `
        <div class="wrap">
          <h1>🕵️ Dota2SpyForSolin</h1>

            </p>

              ${hasTimer ? formatTime(totalSeconds) : "∞"}

              ? "<button id='timerButton' class='btn'>▶️ Запустить таймер</button>"
              : "<div class='guess-status'>♾️ Игра идёт без ограничения по времени</div>"}

          </div>

          <button id="cancelSpyButton" class="btn danger">Отменить игру</button>
        </div>
      `;

      if (hasTimer) {

        var running = false;
        var timer = document.getElementById("timer");
        var timerButton = document.getElementById("timerButton");

        timerButton.addEventListener("click", function() {
          if (running) {
            clearInterval(timerId);
            running = false;
            timerButton.textContent = "▶️ Продолжить таймер";
            return;
          }

          if (seconds <= 0) {
            return;
          }

          running = true;
          timerButton.textContent = "⏸️ Пауза";

          timerId = setInterval(function() {
            seconds -= 1;
            timer.textContent = formatTime(seconds);

            if (seconds <= 0) {
              clearInterval(timerId);
              running = false;
              timer.classList.add("finished");
              timerButton.disabled = true;
              haptic("error");

              setTimeout(function() {
                alert("Время вышло!");
              }, 100);
            }
          }, 1000);
        });
      }

      document.getElementById("finishSpyButton").addEventListener("click", function() {
        clearInterval(timerId);
        renderSpyResultScreen();

      document.getElementById("cancelSpyButton").addEventListener("click", renderHome);

    function renderGuessCards(mode) {

        html += `

    function renderGuessBoard() {
      var player = guessGame.activePlayer;

      app.innerHTML = `

          <h1>🔍 Угадай</h1>

          <div class="guess-status">

      var buttons = document.querySelectorAll("[data-guess-card]");

          toggleGuessCard(Number(this.dataset.guessCard));

        haptic("impact");
        renderGuessBoard();

      document.getElementById("finishGuessButton").addEventListener("click", function() {
        renderGuessResult(0);

    function toggleGuessCard(cardIndex) {
      var crossedList = guessGame.activePlayer === 1
        ? guessGame.crossedByPlayerOne
        : guessGame.crossedByPlayerTwo;

      var position = crossedList.indexOf(cardIndex);

      if (position !== -1) {
        crossedList.splice(position, 1);
        haptic("impact");
        renderGuessBoard();
        return;
      }

      crossedList.push(cardIndex);

      var chosenCard = guessGame.cards[cardIndex];
      var opponentSecret = guessGame.activePlayer === 1
        ? guessGame.playerTwoSecret
        : guessGame.playerOneSecret;

      haptic("impact");

      if (chosenCard.slug === opponentSecret.slug) {
        haptic("success");
        renderGuessResult(guessGame.activePlayer);
      } else {
        renderGuessBoard();
      }
    }

    function renderGuessResult(winner) {
      var winnerText = winner === 1
        ? "🏆 Победил игрок 1!"
        : winner === 2
          ? "🏆 Победил игрок 2!"
          : "🏁 Игра закончена";

      app.innerHTML = `
        <div class="wrap">
          <h1>🔍 Итоги игры</h1>

          <div class="card">
            <div class="result">
              <div class="role-icon">${winner === 0 ? "🤝" : "🏆"}</div>
              <h2>${winnerText}</h2>
              <p class="muted">
                ${winner === 0
                  ? "Никто не зачеркнул секретную карточку соперника."
                  : "Игрок зачеркнул секретную карточку противника."}
              </p>
            </div>
          </div>

          <div class="card">
            <h2>Загадка игрока 1</h2>

            <div class="result">
              <img
                class="secret-preview-image ${guessGame.type === "items" ? "item-image" : ""}"
                src="${getImage(guessGame.playerOneSecret, guessGame.type)}"
                alt=""
              >
              <h2>${escapeHtml(guessGame.playerOneSecret.name)}</h2>
            </div>
          </div>

          <div class="card">
            <h2>Загадка игрока 2</h2>

            <div class="result">
              <img
                class="secret-preview-image ${guessGame.type === "items" ? "item-image" : ""}"
                src="${getImage(guessGame.playerTwoSecret, guessGame.type)}"
                alt=""
              >
              <h2>${escapeHtml(guessGame.playerTwoSecret.name)}</h2>
            </div>
          </div>

          <button id="newGuessGameButton" class="btn">🔄 Новая партия</button>
          <button id="homeFromGuessButton" class="btn alt">🏠 В главное меню</button>
        </div>
      `;

      document.getElementById("newGuessGameButton").addEventListener("click", function() {
        createGuessGame(guessGame.type);
      });

      document.getElementById("homeFromGuessButton").addEventListener("click", renderHome);
    }

    function formatTime(seconds) {
      var minutes = Math.floor(seconds / 60);
      var restSeconds = seconds % 60;

      return String(minutes).padStart(2, "0") +
        ":" +
        String(restSeconds).padStart(2, "0");
    }

    renderHome();
  </script>
</body>
</html>
