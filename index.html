<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Dota2SpyForSolin</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    :root {
      --bg: #101010;
      --card: #1d1d1f;
      --card2: #151515;
      --line: #3a3a3a;
      --text: #ffffff;
      --muted: #aaaaaa;
      --green: #76e5a2;
      --yellow: #ffd166;
      --red: #ff7b7b;
      --blue: #74b9ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .wrap {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 18px 14px calc(36px + env(safe-area-inset-bottom));
    }

    h1 {
      margin: 8px 0 18px;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    h3 {
      margin: 0;
      font-size: 16px;
    }

    p {
      line-height: 1.45;
    }

    .card {
      margin: 12px 0;
      padding: 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      color: #111;
      background: #fff;
      font-weight: 700;
    }

    .btn.alt {
      color: #fff;
      background: #303035;
    }

    .btn.danger {
      color: #fff;
      background: #a83131;
    }

    .btn.yellow {
      color: #211700;
      background: var(--yellow);
    }

    .btn:disabled {
      cursor: default;
      opacity: 0.45;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #d0d0d0;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      color: #fff;
      background: #111;
      border: 1px solid #4a4a4a;
      border-radius: 12px;
      outline: none;
    }

    .game-type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .game-type-button {
      min-height: 155px;
      padding: 16px 10px;
      color: #fff;
      background: var(--card2);
      border: 2px solid #45454b;
      border-radius: 18px;
      font-weight: 700;
    }

    .game-type-button.selected {
      border-color: var(--yellow);
      background: #332d19;
    }

    .game-type-icon {
      display: block;
      margin-bottom: 9px;
      font-size: 48px;
    }

    .game-type-subtitle {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
    }

    .mode-card {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #45454a;
      border-radius: 14px;
      background: var(--card2);
    }

    .picker-title {
      margin: 18px 0 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .portrait-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      max-height: 410px;
      padding-right: 2px;
      overflow-y: auto;
    }

    .portrait-button {
      min-width: 0;
      padding: 0;
      overflow: hidden;
      color: #fff;
      background: #111;
      border: 2px solid #404045;
      border-radius: 11px;
      text-align: left;
    }

    .portrait-button.selected-peaceful {
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green);
    }

    .portrait-button.selected-spy {
      border-color: var(--yellow);
      box-shadow: 0 0 0 1px var(--yellow);
    }

    .portrait-image {
      display: block;
      width: 100%;
      aspect-ratio: 1.45 / 1;
      object-fit: cover;
      background: #272727;
    }

    .item-image {
      object-fit: contain;
      padding: 7px;
      background: #0b0b0b;
    }

    .portrait-name {
      display: block;
      min-height: 36px;
      padding: 5px 4px 6px;
      overflow: hidden;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      text-overflow: ellipsis;
    }

    .picked-info {
      margin-top: 10px;
      padding: 10px;
      color: #d6d6d6;
      background: #101010;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
    }

    .player-number {
      margin: 12px 0 16px;
      color: var(--yellow);
      font-size: 32px;
      font-weight: 800;
      text-align: center;
    }

    .secret-button {
      width: 100%;
      min-height: 165px;
      margin-top: 12px;
      padding: 18px;
      color: #fff;
      background: #35353a;
      border: 2px solid #53535a;
      border-radius: 18px;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.4;
      user-select: none;
      touch-action: none;
    }

    .secret-button.open-peaceful {
      color: #06180d;
      background: var(--green);
      border-color: #b2ffd0;
    }

    .secret-button.open-spy {
      color: #211700;
      background: var(--yellow);
      border-color: #ffe39b;
    }

    .role-image {
      display: block;
      width: min(240px, 84%);
      height: 135px;
      margin: 12px auto 0;
      object-fit: cover;
      background: #121212;
      border-radius: 12px;
    }

    .role-item-image {
      object-fit: contain;
      padding: 12px;
    }

    .timer {
      margin: 20px 0;
      color: var(--green);
      font-size: 58px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .timer.finished {
      color: var(--red);
    }

    .result {
      padding: 16px;
      text-align: center;
      background: var(--card2);
      border-radius: 14px;
    }

    .result-image {
      display: block;
      width: min(260px, 90%);
      height: 145px;
      margin: 12px auto;
      object-fit: cover;
      background: #0d0d0d;
      border-radius: 12px;
    }

    .result-item-image {
      object-fit: contain;
      padding: 12px;
    }

    .role-icon {
      margin: 8px 0;
      font-size: 58px;
      text-align: center;
    }

    .peaceful-title {
      color: var(--green);
    }

    .spy-title {
      color: var(--yellow);
    }
  </style>
</head>

    function randomItem(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function shuffle(list) {
      const result = list.slice();

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temporary = result[i];
        result[i] = result[j];
        result[j] = temporary;
      }

      return result;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function haptic(type) {
      try {
        const tg = window.Telegram && window.Telegram.WebApp;

        if (!tg || !tg.HapticFeedback) {
          return;
        }

        if (type === "success") {
          tg.HapticFeedback.notificationOccurred("success");
        } else if (type === "error") {
          tg.HapticFeedback.notificationOccurred("error");
        } else {
          tg.HapticFeedback.impactOccurred("medium");
        }
      } catch (error) {
        console.log(error);
      }
    }
