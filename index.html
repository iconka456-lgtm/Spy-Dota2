<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{
  --bg:#101010;
  --card:#1d1d1f;
  --card2:#151515;
  --line:#3a3a3a;
  --text:#ffffff;
  --muted:#aaaaaa;
  --green:#76e5a2;
  --yellow:#ffd166;
  --red:#ff7b7b;
  --blue:#7ec8ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  max-width:620px;
  margin:auto;
  padding:18px 14px 36px;
}

h1{
  margin:8px 0 18px;
  font-size:28px;
}

.home-title{
  text-align:center;
  margin-top:20px;
  margin-bottom:24px;
}

h2{
  margin:0 0 10px;
  font-size:21px;
}

h3{
  margin:0 0 8px;
  font-size:17px;
}

p{
  line-height:1.45;
}

.card{
  margin:12px 0;
  padding:17px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.hidden{
  display:none!important;
}

.btn{
  width:100%;
  margin-top:10px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#ffffff;
  color:#111111;
  font-weight:700;
}

.alt{
  background:#303035;
  color:#ffffff;
}

.danger{
  background:#a83131;
  color:#ffffff;
}

.yellow{
  background:var(--yellow);
  color:#211700;
}

.blue{
  background:var(--blue);
  color:#071925;
}

.green{
  background:var(--green);
  color:#06180d;
}

.btn:disabled{
  opacity:.45;
}

label{
  display:block;
  margin:12px 0 6px;
  color:#d0d0d0;
  font-size:14px;
}

input,select{
  width:100%;
  padding:13px;
  color:#ffffff;
  background:#111111;
  border:1px solid #4a4a4a;
  border-radius:12px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mode{
  min-height:140px;
  padding:15px 8px;
  background:var(--card2);
  color:#ffffff;
  border:2px solid #45454b;
  border-radius:18px;
  font-weight:700;
}

.mode .ico{
  display:block;
  margin-bottom:9px;
  font-size:44px;
}

.mode small{
  display:block;
  margin-top:7px;
  color:var(--muted);
  font-weight:400;
}

.selected{
  background:#332d19!important;
  border-color:var(--yellow)!important;
}

.box{
  margin-top:10px;
  padding:14px;
  background:var(--card2);
  border:1px solid #45454a;
  border-radius:14px;
}

.player{
  margin:12px 0 16px;
  color:var(--yellow);
  font-size:32px;
  font-weight:800;
  text-align:center;
}

.secret{
  width:100%;
  min-height:145px;
  margin-top:12px;
  padding:18px;
  color:#ffffff;
  background:#35353a;
  border:2px solid #53535a;
  border-radius:18px;
  font-size:19px;
  font-weight:800;
  line-height:1.4;
  user-select:none;
  touch-action:none;
}

.peace{
  color:#06180d;
  background:var(--green);
  border-color:#b2ffd0;
}

.spy{
  color:#211700;
  background:var(--yellow);
  border-color:#ffe39b;
}

.timer{
  margin:18px 0;
  color:var(--green);
  font-size:56px;
  font-weight:800;
  text-align:center;
}

.timer.finished{
  color:var(--red);
}

.result{
  padding:16px;
  text-align:center;
  background:var(--card2);
  border-radius:14px;
}

.role{
  font-size:58px;
  text-align:center;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  margin-top:8px;
}

.gcard{
  position:relative;
  min-height:88px;
  overflow:hidden;
  padding:3px;
  color:#ffffff;
  background:linear-gradient(145deg,#29292f,#101011);
  border:1px solid #705b2d;
  border-radius:10px;
  box-shadow:0 2px 7px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  font-size:9px;
  font-weight:800;
  line-height:1.05;
  text-align:center;
}

.gcard:active{
  transform:scale(.95);
  border-color:var(--yellow);
}

.pic{
  display:block;
  width:100%;
  height:55px;
  margin:auto;
  object-fit:cover;
  background:#252525;
  border:1px solid rgba(255,209,102,.25);
  border-radius:7px;
}

.gcard span{
  position:absolute;
  right:2px;
  bottom:2px;
  left:2px;
  display:flex;
  min-height:22px;
  align-items:center;
  justify-content:center;
  padding:2px;
  overflow:hidden;
  background:linear-gradient(transparent,rgba(0,0,0,.95) 38%);
  border-radius:0 0 7px 7px;
  text-shadow:0 1px 3px #000000;
}

.item .pic{
  padding:4px;
  object-fit:contain;
  background:radial-gradient(circle,#34323a,#101010);
}

.gcard.crossed{
  opacity:.38;
  border-color:#c54c4c;
  filter:grayscale(.6);
}

.gcard.crossed:before,
.gcard.crossed:after{
  position:absolute;
  z-index:3;
  top:50%;
  left:-15%;
  width:130%;
  height:4px;
  content:"";
  background:#ff6262;
  border:1px solid rgba(255,255,255,.45);
  border-radius:99px;
  box-shadow:0 0 7px rgba(255,70,70,.9);
}

.gcard.crossed:before{
  transform:rotate(35deg);
}

.gcard.crossed:after{
  transform:rotate(-35deg);
}

.status{
  margin:12px 0;
  padding:12px;
  color:#d8ecff;
  background:#112635;
  border:1px solid #28516b;
  border-radius:13px;
  text-align:center;
}

.preview{
  display:block;
  width:150px;
  height:100px;
  margin:12px auto;
  object-fit:cover;
  background:#111111;
  border:1px solid #705b2d;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.55);
}

.preview.item{
  padding:12px;
  object-fit:contain;
  background:radial-gradient(circle,#34323a,#101010);
}

.build-items{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}

.build-item{
  padding:7px 4px;
  background:#111111;
  border:1px solid #5a4720;
  border-radius:11px;
  font-size:10px;
  font-weight:700;
  text-align:center;
}

.build-item img{
  display:block;
  width:54px;
  height:54px;
  margin:0 auto 5px;
  padding:3px;
  object-fit:contain;
  background:radial-gradient(circle,#34323a,#101010);
  border-radius:7px;
}

.err{
  margin:20px;
  padding:16px;
  background:#3b1717;
  border:1px solid #f07a7a;
  border-radius:15px;
}

.tiny-note{
  margin-top:8px;
  color:#666666;
  font-size:10px;
  line-height:1.2;
  text-align:center;
}

.choice-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.choice-btn{
  padding:14px;
  color:#ffffff;
  background:#2a2a2f;
  border:0;
  border-radius:13px;
  font-weight:800;
}

.choice-btn.active{
  color:var(--yellow);
  background:#403515;
}

.quiz-answer{
  min-height:115px;
  padding:14px 8px;
  color:#ffffff;
  background:var(--card2);
  border:2px solid #45454b;
  border-radius:18px;
  font-weight:800;
}

.quiz-answer.good{
  color:#06180d;
  background:var(--green);
  border-color:#b2ffd0;
}

.quiz-answer.bad{
  color:#ffffff;
  background:#8b2727;
  border-color:#ff7b7b;
}

@media(max-width:360px){
  .cards{gap:4px}
  .gcard{min-height:78px;padding:2px;font-size:8px}
  .pic{height:48px}
  .gcard span{min-height:19px;padding:1px}
}
</style>
</head>

function esc(v){
  return String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function rnd(a){
  return a[Math.floor(Math.random()*a.length)];
}

function mix(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=b[i];
    b[i]=b[j];
    b[j]=t;
  }
  return b;
}

function img(o,t){
  return "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/"+
    (t==="heroes"?"heroes/":"items/")+
    o.slug+
    ".png";
}

function fmt(s){
  return String(Math.floor(s/60)).padStart(2,"0")+":"+
    String(s%60).padStart(2,"0");
}

function buzz(){

    if(window.Telegram&&Telegram.WebApp){

function startSpy(){
  var players=Math.max(3,Math.min(20,Number(document.getElementById("p").value)||5));
  var spiesCount=Math.max(1,Math.min(players-1,Number(document.getElementById("s").value)||1));
  var minutes=Math.max(1,Math.min(60,Number(document.getElementById("min").value)||8));

  var peacefulCard;
  var spyCard;
  var location="";

  if(spyType==="heroes"){
    if(spyMode==="host"){
      peacefulCard=document.getElementById("ph").value;
      spyCard=document.getElementById("sh").value;
      location=document.getElementById("lo").value;

      if(peacefulCard===spyCard){
        alert("Выбери разных героев для мирных и шпионов.");
        return;
      }
    }else{
      peacefulCard=rnd(heroes).name;

      do{
        spyCard=rnd(heroes).name;
      }while(spyCard===peacefulCard);

      location=rnd([
        "Таверна",
        "Рошанова яма",
        "Мид-лейн",
        "Лес Radiant",
        "Лес Dire",
        "Фонтан Radiant",
        "Фонтан Dire",
        "Секретный магазин",
        "Лагерь древних крипов"
      ]);
    }
  }else{
    if(spyMode==="host"){
      peacefulCard=items.filter(function(item){
        return item.slug===document.getElementById("pi").value;
      })[0];

      spyCard=items.filter(function(item){
        return item.slug===document.getElementById("si").value;
      })[0];

      if(peacefulCard.slug===spyCard.slug){
        alert("Выбери разные предметы для мирных и шпионов.");
        return;
      }
    }else{
      peacefulCard=rnd(items);

      do{
        spyCard=rnd(items);
      }while(spyCard.slug===peacefulCard.slug);
    }
  }

  spyGame={
    type:spyType,
    mode:spyMode,
    timer:timerMode,
    players:players,
    minutes:minutes,
    peacefulCard:peacefulCard,
    spyCard:spyCard,
    location:location,
    spies:mix(
      Array.from({length:players},function(_,index){
        return index;
      })
    ).slice(0,spiesCount),
    current:0
  };

  spyRole();
}

function spyRole(){
  var number=spyGame.current+1;
  var isSpy=spyGame.spies.indexOf(spyGame.current)!==-1;
  var isLast=number===spyGame.players;

  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Шпион</h1>'+
      '<div class="card">'+
        '<div class="player">Игрок '+number+'</div>'+
        '<p class="muted" style="text-align:center">Другие игроки не должны смотреть на экран.</p>'+
        '<button id="role" class="secret">Нажми и удерживай,<br>чтобы увидеть карточку</button>'+
        '<button id="next" class="btn alt" disabled>'+
          (isLast?"🚀 Начать игру":"Передать игроку "+(number+1))+
        '</button>'+
      '</div>'+
      '<button id="cancel" class="btn danger">Отменить игру</button>'+
    '</div>';

  var roleButton=document.getElementById("role");
  var nextButton=document.getElementById("next");
  var shown=false;
  var opened=false;

  function getSecretName(){
    var secret=isSpy?spyGame.spyCard:spyGame.peacefulCard;
    return spyGame.type==="heroes"?secret:secret.name;
  }

  function showSecret(){
    if(opened)return;

    opened=true;
    shown=true;

    var secretName=getSecretName();

    if(spyGame.mode==="hidden"){
      roleButton.classList.add("spy");

      roleButton.innerHTML=
        '🔒<br>Секретная карточка<br>'+
        '<span style="font-size:18px">'+esc(secretName)+'</span>'+
        (spyGame.type==="heroes"
          ?'<br><span style="font-size:14px">Локация: '+esc(spyGame.location)+'</span>'
          :"");
    }else{
      roleButton.classList.add(isSpy?"spy":"peace");

      roleButton.innerHTML=
        (isSpy?"🕵️<br>ТЫ ШПИОН":"🛡️<br>ТЫ МИРНЫЙ")+
        '<br><span style="font-size:18px">'+esc(secretName)+'</span>'+
        (spyGame.type==="heroes"
          ?'<br><span style="font-size:14px">Локация: '+esc(spyGame.location)+'</span>'
          :"");
    }

    buzz();
  }

  function hideSecret(){
    if(!opened)return;

    opened=false;
    roleButton.classList.remove("spy","peace");
    roleButton.innerHTML="Нажми и удерживай,<br>чтобы увидеть карточку";
    nextButton.disabled=false;
  }

  roleButton.onpointerdown=function(event){
    event.preventDefault();
    showSecret();
  };

  roleButton.onpointerup=function(event){
    event.preventDefault();
    hideSecret();
  };

  roleButton.onpointerleave=hideSecret;
  roleButton.onpointercancel=hideSecret;

  nextButton.onclick=function(){
    if(!shown)return;

    if(spyGame.current<spyGame.players-1){
      spyGame.current++;
      spyRole();
    }else{
      spyPlay();
    }
  };

  document.getElementById("cancel").onclick=home;
}

function spyPlay(){
  var timed=spyGame.timer==="withTime";
  var seconds=spyGame.minutes*60;

  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Шпион</h1>'+
      '<div class="card">'+
        '<h2>Игра началась</h2>'+
        '<p class="muted">'+
          (spyGame.mode==="hidden"
            ?"Роли скрыты: никто не знает, кто шпион, а кто мирный."
            :"Обсуждайте карточки, задавайте вопросы и ищите шпионов.")+
        '</p>'+
        '<div id="time" class="timer">'+(timed?fmt(seconds):"∞")+'</div>'+
        (timed?'<button id="timerButton" class="btn">▶️ Запустить таймер</button>':'<div class="status">♾️ Игра без времени</div>')+
        '<button id="finish" class="btn yellow">🏁 Закончить раунд</button>'+
      '</div>'+
      '<button id="cancel" class="btn danger">Отменить игру</button>'+
    '</div>';

  if(timed){
    var running=false;
    var time=document.getElementById("time");
    var button=document.getElementById("timerButton");

    button.onclick=function(){
      if(running){
        clearInterval(timerId);
        running=false;
        button.textContent="▶️ Продолжить таймер";
        return;
      }

      if(seconds<=0)return;

      running=true;
      button.textContent="⏸️ Пауза";

      timerId=setInterval(function(){
        seconds--;
        time.textContent=fmt(seconds);

        if(seconds<=0){
          clearInterval(timerId);
          time.classList.add("finished");
          button.disabled=true;
        }
      },1000);
    };
  }

  document.getElementById("finish").onclick=spyResult;
  document.getElementById("cancel").onclick=home;
}

function spyResult(){
  clearInterval(timerId);

  var peacefulName=spyGame.type==="heroes"

          '<div class="role">🛡️</div>'+
          '<h2>Мирные</h2>'+
          '<p><b>'+esc(peacefulName)+'</b></p>'+
          (spyGame.type==="heroes"
            ?'<p>Локация: <b>'+esc(spyGame.location)+'</b></p>'
            :"")+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="result">'+
          '<div class="role">🕵️</div>'+
          '<h2>Шпионы</h2>'+
          '<p><b>'+esc(spyName)+'</b></p>'+
          '<p>'+esc(spiesText)+'</p>'+
        '</div>'+
      '</div>'+
      '<button id="homeButton" class="btn">🏠 В главное меню</button>'+

  document.getElementById("homeButton").onclick=home;

function newGuess(type){
  guessGame={
    type:type,
    cards:mix(type==="heroes"?heroes:items).slice(0,20),
    one:null,
    two:null,
    active:1,
    crossed:[[],[]]
  };

  chooseSecret(1);
}

function renderGuessCards(playMode){
  return guessGame.cards.map(function(card,index){
    var crossed=playMode&&guessGame.crossed[guessGame.active-1].indexOf(index)!==-1;

    return (
      '<button class="gcard '+
      (guessGame.type==="items"?"item ":"")+
      (crossed?"crossed":"")+
      '" data-card="'+index+'">'+
      '<img class="pic" src="'+img(card,guessGame.type)+'" alt="" loading="lazy">'+
      '<span>'+esc(card.name)+'</span>'+
      '</button>'
    );
  }).join("");
}

function chooseSecret(player){
  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Угадай в карточках</h1>'+
      '<div class="card">'+
        '<div class="player">Игрок '+player+'</div>'+
        '<p class="muted" style="text-align:center">Выбери секретную карточку.</p>'+
        '<div class="cards">'+renderGuessCards(false)+'</div>'+
        '<button id="cancel" class="btn danger">Отменить игру</button>'+
      '</div>'+
    '</div>';

  document.querySelectorAll("[data-card]").forEach(function(button){
    button.onclick=function(){
      var index=Number(button.dataset.card);
      var card=guessGame.cards[index];

      if(player===1){
        guessGame.one=card;
      }else{
        guessGame.two=card;
      }

      confirmSecret(player);
    };
  });

  document.getElementById("cancel").onclick=home;
}

function confirmSecret(player){
  var card=player===1?guessGame.one:guessGame.two;

  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Угадай в карточках</h1>'+
      '<div class="card">'+
        '<div class="player">Игрок '+player+'</div>'+
        '<p class="muted" style="text-align:center">Ты загадал:</p>'+
        '<div class="result">'+
          '<img class="preview '+(guessGame.type==="items"?"item":"")+'" src="'+img(card,guessGame.type)+'" alt="">'+
          '<h2>'+esc(card.name)+'</h2>'+
        '</div>'+
        '<button id="continue" class="btn">'+
          (player===1?"Передать телефон игроку 2":"🚀 Начать игру")+
        '</button>'+
        '<button id="change" class="btn alt">← Выбрать другую</button>'+
      '</div>'+
    '</div>';

  document.getElementById("continue").onclick=function(){
    if(player===1){
      app.innerHTML=
        '<div class="wrap">'+
          '<h1>Угадай в карточках</h1>'+
          '<div class="card">'+
            '<div class="player">Передай телефон</div>'+
            '<button id="go" class="btn">Игрок 2: выбрать карточку</button>'+
          '</div>'+
        '</div>';

      document.getElementById("go").onclick=function(){
        chooseSecret(2);
      };
    }else{
      guessGame.active=1;
      guessBoard();
    }
  };

  document.getElementById("change").onclick=function(){
    chooseSecret(player);
  };
}

function guessBoard(){
  var player=guessGame.active;

  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Угадай в карточках</h1>'+
      '<div class="status">Сейчас ходит <b>Игрок '+player+'</b>. Нажимай карточки, чтобы зачеркнуть неподходящие варианты.</div>'+
      '<div class="card">'+
        '<div class="cards">'+renderGuessCards(true)+'</div>'+
        '<button id="guess" class="btn green">✅ Я угадал карточку соперника</button>'+
        '<button id="switch" class="btn blue">🔄 Передать ход игроку '+(player===1?"2":"1")+'</button>'+
        '<button id="finish" class="btn yellow">🏁 Закончить без победителя</button>'+
        '<button id="cancel" class="btn danger">Отменить игру</button>'+
      '</div>'+
    '</div>';

  document.querySelectorAll("[data-card]").forEach(function(button){
    button.onclick=function(){
      toggleGuessCard(Number(button.dataset.card));
    };
  });

  document.getElementById("guess").onclick=function(){
    var answer=prompt("Введи номер карточки от 1 до 20.");

    if(!answer)return;

    var index=Number(answer)-1;

    if(index<0||index>=guessGame.cards.length){
      alert("Нужно ввести число от 1 до 20.");
      return;
    }

    var enemy=guessGame.active===1?guessGame.two:guessGame.one;

    if(guessGame.cards[index].slug===enemy.slug){
      guessResult(guessGame.active);
    }else{
      alert("Неверно. Продолжайте игру.");
    }
  };

  document.getElementById("switch").onclick=function(){
    guessGame.active=player===1?2:1;
    guessBoard();
  };

  document.getElementById("finish").onclick=function(){
    guessResult(0);
  };

  document.getElementById("cancel").onclick=home;
}

function toggleGuessCard(index){
  var list=guessGame.crossed[guessGame.active-1];
  var exists=list.indexOf(index);

  if(exists!==-1){
    list.splice(exists,1);
  }else{
    list.push(index);
  }

  guessBoard();
}

        '<h2>Игрок 1 загадал</h2>'+

      '</div>'+

    randomShow("hero");
  };

  document.getElementById("item").onclick=function(){
    randomShow("item");
  };

  document.getElementById("build").onclick=function(){
    randomShow("build");
  };

  document.getElementById("back").onclick=home;
}

function randomShow(mode){
  var hero=rnd(heroes);
  var item=rnd(items);
  var content="";

  if(mode==="hero"){
    content=
      '<div class="result">'+
        '<img class="preview" src="'+img(hero,"heroes")+'" alt="">'+
        '<h2>'+esc(hero.name)+'</h2>'+
        '<div class="status">Главный атрибут: <b>'+esc(hero.attr)+'</b></div>'+
      '</div>';
  }

  if(mode==="item"){
    content=
      '<div class="result">'+
        '<img class="preview item" src="'+img(item,"items")+'" alt="">'+
        '<h2>'+esc(item.name)+'</h2>'+
      '</div>';
  }

  if(mode==="build"){
    var count=3+Math.floor(Math.random()*3);
    var build=mix(items).slice(0,count);

    content=
      '<div class="result">'+
        '<img class="preview" src="'+img(hero,"heroes")+'" alt="">'+
        '<h2>'+esc(hero.name)+'</h2>'+
        '<div class="status">Главный атрибут: <b>'+esc(hero.attr)+'</b></div>'+
        '<h3 style="margin-top:16px">Случайная сборка</h3>'+
        '<div class="build-items">'+
          build.map(function(buildItem){
            return (
              '<div class="build-item">'+
                '<img src="'+img(buildItem,"items")+'" alt="">'+
                esc(buildItem.name)+
              '</div>'
            );
          }).join("")+
        '</div>'+
      '</div>';
  }

  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Случайный режим</h1>'+
      '<div class="card">'+
        content+
        '<button id="again" class="btn green">🔄 Ещё раз</button>'+
        '<button id="back" class="btn alt">← Назад</button>'+
      '</div>'+
    '</div>';

  document.getElementById("again").onclick=function(){
    randomShow(mode);
  };

  document.getElementById("back").onclick=randomMenu;
}

function strengthQuiz(){
  var hero=rnd(heroes);
  var options=mix(["Сила","Ловкость","Интеллект","Универсальный"]);
  var locked=false;

  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Угадай по силе</h1>'+
      '<div class="card">'+
        '<div class="result">'+
          '<img class="preview" src="'+img(hero,"heroes")+'" alt="">'+
          '<h2>'+esc(hero.name)+'</h2>'+
          '<p class="muted">Какой у этого героя главный атрибут?</p>'+
        '</div>'+
        '<div class="grid2">'+
          options.map(function(option){
            return '<button class="quiz-answer" data-answer="'+esc(option)+'">'+esc(option)+'</button>';
          }).join("")+
        '</div>'+
        '<button id="next" class="btn green">Следующий вопрос</button>'+
        '<button id="back" class="btn alt">← В главное меню</button>'+
      '</div>'+
    '</div>';

  document.querySelectorAll("[data-answer]").forEach(function(button){
    button.onclick=function(){
      if(locked)return;

      locked=true;

      var answer=button.dataset.answer;

      document.querySelectorAll("[data-answer]").forEach(function(otherButton){
        if(otherButton.dataset.answer===hero.attr){
          otherButton.classList.add("good");
          otherButton.textContent="✅ "+hero.attr;
        }
      });

      if(answer!==hero.attr){
        button.classList.add("bad");
        button.textContent="❌ "+answer;
      }

      buzz();
    };
  });

  document.getElementById("next").onclick=strengthQuiz;
  document.getElementById("back").onclick=home;
}

home();
</script>
</body>
</html>
