function tgUser(){
  const u = tg?.initDataUnsafe?.user;
  if(!u?.id) return null;
  return {

    username: u.username || '',
    first_name: u.first_name || 'Игрок'

}

function save(){

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, x => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[x]));
}

function code(){
  return Math.random().toString(36).slice(2,8).toUpperCase();
}

}

async function createRoom(){
  const user = tgUser();
  if(!user){
    showError('Telegram не передал данные пользователя. Открой мини-приложение внутри Telegram.');
    return;
  }

  const roomCode = code();
  const mode = document.getElementById('roomMode')?.value || 'random';
  const hero = mode === 'host' ? (document.getElementById('heroPick')?.value || heroes[0]) : heroes[Math.floor(Math.random()*heroes.length)];
  const location = mode === 'host' ? (document.getElementById('locationPick')?.value || locations[0]) : locations[Math.floor(Math.random()*locations.length)];
  const spiesCount = Number(document.getElementById('spiesCount')?.value || 1);
  const playersCount = Number(document.getElementById('playersCount')?.value || 5);

  try{
    const {data: room, error} = await supabaseClient.from('rooms').insert({
      code: roomCode,
      host_telegram_id: user.id,
      players_count: playersCount,
      spies_count: spiesCount,
      hero,
      location,
      mode,
      status:'waiting',
      current_player:0
    }).select().single();
    if(error) throw error;

    const {data: player, error: pError} = await supabaseClient.from('room_players').insert({
      room_id: room.id,
      telegram_id: user.id,
      player_number:0,
      is_spy:false
    }).select().single();
    if(pError) throw pError;

    state = {roomId:room.id, roomCode:room.code, userId:user.id, isHost:true};
    me = player;
    save();
    await loadRoom();
  }catch(e){
    console.error(e);
    showError('Не удалось создать комнату:\
' + e.message);
  }
}

async function joinRoom(){
  const input = document.getElementById('joinCode');
  const roomCode = (input?.value || '').trim().toUpperCase();
  if(roomCode.length < 4){
    alert('Введи код комнаты');
    return;
  }

  const user = tgUser();
  if(!user){
    showError('Telegram не передал данные пользователя. Открой мини-приложение внутри Telegram.');
    return;
  }

  try{
    const {data: room, error} = await supabaseClient
      .from('rooms')
      .select('*')
      .eq('code', roomCode)
      .maybeSingle();

    if(error) throw error;
    if(!room) throw new Error('Комната не найдена');
    if(room.status !== 'waiting') throw new Error('Игра в этой комнате уже началась');

    const {data: oldPlayer} = await supabaseClient
      .from('room_players')
      .select('*')
      .eq('room_id', room.id)
      .eq('telegram_id', user.id)
      .maybeSingle();

    let player = oldPlayer;

    if(!player){
      const {count, error: countError} = await supabaseClient
        .from('room_players')
        .select('*', {count:'exact', head:true})
        .eq('room_id', room.id);

      if(countError) throw countError;
      if((count || 0) >= room.players_count) throw new Error('Комната заполнена');

      const {data:p, error:pError} = await supabaseClient.from('room_players').insert({
        room_id: room.id,
        telegram_id: user.id,
        player_number: count || 0,
        is_spy:false
      }).select().single();

      if(pError) throw pError;
      player = p;
    }

    state = {roomId:room.id, roomCode:room.code, userId:user.id, isHost:Number(room.host_telegram_id)===user.id};
    me = player;
    save();
    await loadRoom();
  }catch(e){
    console.error(e);
    alert(e.message);
  }
}

async function loadRoom(){
  if(!state?.roomId) return home();

  const {data:room, error} = await supabaseClient
    .from('rooms')
    .select('*')
    .eq('id', state.roomId)
    .single();

  if(error) return showError(error.message);
  roomData = room;

  const {data:players, error:pError} = await supabaseClient
    .from('room_players')
    .select('*')
    .eq('room_id', room.id)
    .order('player_number');

  if(pError) return showError(pError.message);

  roomPlayersCache = players || [];
  me = roomPlayersCache.find(p => Number(p.telegram_id) === Number(state.userId)) || null;
  if(!me) return showError('Твой игрок не найден');

  subscribe(room.id);
  render();
}

function subscribe(roomId){
  if(channel) return;

  channel = supabaseClient
    .channel('spy-room-' + roomId)
    .on('postgres_changes',
      {event:'UPDATE',schema:'public',table:'rooms',filter:'id=eq.' + roomId},
      async () => { await loadRoom(); }
    )
    .on('postgres_changes',
      {event:'INSERT',schema:'public',table:'room_players',filter:'room_id=eq.' + roomId},
      async () => { await loadRoom(); }
    )
    .on('postgres_changes',
      {event:'UPDATE',schema:'public',table:'room_players',filter:'room_id=eq.' + roomId},
      async () => { await loadRoom(); }
    )
    .on('postgres_changes',
      {event:'DELETE',schema:'public',table:'room_players',filter:'room_id=eq.' + roomId},
      async () => { await loadRoom(); }
    )
    .subscribe();
}

function renderKey(){
  return JSON.stringify({
    status: roomData?.status || '',
    code: roomData?.code || '',
    mode: roomData?.mode || '',
    hero: roomData?.hero || '',
    location: roomData?.location || '',
    spies_count: roomData?.spies_count || '',
    players: roomPlayersCache.map(p => [p.id,p.telegram_id,p.player_number,p.is_spy]),
    me: me ? [me.id, me.telegram_id, me.player_number, me.is_spy] : null
  });
}

function render(){
  if(!roomData) return home();
  const key = renderKey();
  if(key === lastRenderKey) return;
  lastRenderKey = key;

  if(roomData.status === 'waiting') return renderWaiting();
  if(roomData.status === 'playing') return renderPlaying();
  if(roomData.status === 'finished') return renderFinished();
  renderWaiting();
}

function getSpyIndexes(count, spyCount){
  const indexes = [...Array(count).keys()];
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  return new Set(indexes.slice(0, spyCount));
}

async function startGame(){
  if(!state?.isHost) return;

  const {data:players, error} = await supabaseClient
    .from('room_players')
    .select('*')
    .eq('room_id', state.roomId)
    .order('player_number');

  if(error) return alert(error.message);

  if(players.length < 3){
    alert('Нужно минимум 3 игрока');
    return;
  }

  const spyCount = Math.min(Number(roomData.spies_count) || 1, players.length - 1);
  const spies = getSpyIndexes(players.length, spyCount);

  for(let i=0;i<players.length;i++){
    const {error:e} = await supabaseClient
      .from('room_players')
      .update({is_spy:spies.has(i)})
      .eq('id',players[i].id);
    if(e) return alert(e.message);
  }

  const {error:e} = await supabaseClient
    .from('rooms')
    .update({status:'playing', current_player:0})
    .eq('id',state.roomId);

  if(e) alert(e.message);
}
