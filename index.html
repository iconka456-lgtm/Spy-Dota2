<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Dota2SpyForSolin</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #101010;
      --card: #1d1d1f;
      --card2: #121212;
      --line: #353535;
      --text: #fff;
      --muted: #9a9a9a;
      --green: #76e5a2;
      --yellow: #ffd166;
      --red: #ff7b7b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .wrap {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 18px 14px calc(42px + env(safe-area-inset-bottom));
    }

    h1 {
      margin: 8px 0 18px;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    p {
      line-height: 1.45;
    }

    .card {
      margin: 12px 0;
      padding: 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 13px;
    }

    .ok {
      color: var(--green);
    }

    .warn {
      color: var(--yellow);
    }

    .error {
      color: var(--red);
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      color: #111;
      background: #fff;
      font-weight: 700;
    }

    .btn.alt {
      color: #fff;
      background: #2b2b2f;
    }

    .btn.danger {
      color: #fff;
      background: #a83131;
    }

    .btn.yellow {
      color: #201700;
      background: var(--yellow);
    }

    .btn:disabled {
      cursor: default;
      opacity: .45;
    }

    label {
      display: block;
      margin: 11px 0 5px;
      color: #c6c6c6;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      color: #fff;
      background: #101010;
      border: 1px solid #444;
      border-radius: 12px;
      outline: none;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status {
      margin-top: 12px;
      padding: 11px 12px;
      color: #c8c8c8;
      background: var(--card2);
      border-radius: 12px;
      line-height: 1.45;
    }

    .role {
      margin: 14px 0;
      font-size: 68px;
      text-align: center;
    }

    .secret {
      margin: 15px 0;
      padding: 16px;
      text-align: center;
      background: var(--card2);
      border-radius: 14px;
    }

    .hero-image {
      display: block;
      width: 190px;
      height: 107px;
      margin: 0 auto 12px;
      object-fit: cover;
      background: #000;
      border-radius: 10px;
    }

    .player-number {
      margin: 18px 0 10px;
      color: var(--yellow);
      font-size: 30px;
      font-weight: 800;
      text-align: center;
    }

    .hold-button {
      min-height: 130px;
      margin-top: 16px;
      padding: 20px;
      color: #fff;
      background: #343438;
      border: 2px solid #535357;
      border-radius: 18px;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.35;
      user-select: none;
      touch-action: none;
    }

    .hold-button.holding {
      color: #171100;
      background: var(--yellow);
      border-color: #ffe09a;
      transform: scale(.985);
    }

    .timer {
      margin: 16px 0;
      color: var(--green);
      font-size: 58px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .timer.finished {
      color: var(--red);
    }

    .rules {
      margin: 0;
      padding-left: 20px;
      line-height: 1.55;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>

    const app = document.getElementById("app");

    const heroes = [

      "Medusa": "medusa",

      "Monkey King": "monkey_king",
      "Morphling": "morphling",

      "Naga Siren": "naga_siren",
      "Nature's Prophet": "furion",
      "Necrophos": "necrolyte",
      "Night Stalker": "night_stalker",

      "Slardar": "slardar",
      "Slark": "slark",
      "Snapfire": "snapfire",
      "Sniper": "sniper",

      "Spirit Breaker": "spirit_breaker",
      "Storm Spirit": "storm_spirit",
      "Sven": "sven",
      "Techies": "techies",
      "Templar Assassin": "templar_assassin",
      "Terrorblade": "terrorblade",
      "Tidehunter": "tidehunter",
      "Tinker": "tinker",
      "Tiny": "tiny",
      "Treant Protector": "treant",
      "Troll Warlord": "troll_warlord",
      "Tusk": "tusk",
      "Undying": "undying",
      "Ursa": "ursa",
      "Venomancer": "venomancer",
      "Viper": "viper",
      "Visage": "visage",
      "Void Spirit": "void_spirit",
      "Warlock": "warlock",
      "Weaver": "weaver",
      "Windranger": "windrunner",
      "Winter Wyvern": "winter_wyvern",
      "Witch Doctor": "witch_doctor",
      "Wraith King": "skeleton_king",
      "Zeus": "zuus"
    };

    let game = null;
    let timerInterval = null;

    try {
      const tg = window.Telegram && window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

      if (tg) {
        tg.ready();
        tg.expand();
      }
    } catch (error) {
      console.warn("Telegram WebApp API недоступен", error);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function randomItem(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function shuffle(list) {
      const copy = list.slice();

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }

      return copy;
    }

    function getHeroImage(hero) {
      const slug = heroSlugs[hero];
      if (!slug) return "";

      return "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/" +
        slug +
        ".png";
    }

    function vibrate(type) {
      try {
        const tg = window.Telegram && window.Telegram.WebApp;

        if (tg && tg.HapticFeedback) {
          if (type === "error") tg.HapticFeedback.notificationOccurred("error");
          else if (type === "success") tg.HapticFeedback.notificationOccurred("success");
          else tg.HapticFeedback.impactOccurred("medium");
        }
      } catch (error) {
        console.warn(error);
      }
    }

    function renderHome() {
      clearInterval(timerInterval);

      app.innerHTML = `
        <div class="wrap">
          <h1>🕵️ ${APP_NAME}</h1>

          <div class="card">
            <h2>Игра на одном телефоне</h2>
            <p class="muted">
              Настрой игру, раздай роли по очереди и передавай телефон следующему игроку.
            </p>

            <label for="playersCount">Количество игроков</label>
            <input id="playersCount" type="number" min="3" max="20" value="5">

            <label for="spiesCount">Количество шпионов</label>
            <input id="spiesCount" type="number" min="1" max="5" value="1">

            <label for="roundMinutes">Время обсуждения (минуты)</label>
            <input id="roundMinutes" type="number" min="1" max="60" value="8">

            <label for="gameMode">Режим</label>
            <select id="gameMode">
              <option value="random">🎲 Случайный герой и локация</option>
              <option value="host">🎙️ Ведущий выбирает героя и локацию</option>
            </select>

            <div id="hostOptions" class="hidden">
              <label for="selectedHero">Герой</label>
              <select id="selectedHero">
                ${heroes.map(hero => `
                  <option value="${escapeHtml(hero)}">${escapeHtml(hero)}</option>
                `).join("")}
              </select>

              <label for="selectedLocation">Локация</label>
              <select id="selectedLocation">
                ${locations.map(location => `
                  <option value="${escapeHtml(location)}">${escapeHtml(location)}</option>
                `).join("")}
              </select>
            </div>

            <button class="btn" id="createGameButton">🎮 Создать игру</button>
          </div>

          <div class="card">
            <h2>Правила раздачи</h2>
            <ol class="rules muted">
              <li>Игрок берёт телефон.</li>
              <li>Нажимает и удерживает кнопку, чтобы увидеть роль.</li>
              <li>Отпускает кнопку — роль скрывается.</li>
              <li>Передаёт телефон следующему игроку.</li>
            </ol>
          </div>
        </div>
      `;

      document.getElementById("gameMode").addEventListener("change", function() {
        const mode = document.getElementById("gameMode").value;
        document.getElementById("hostOptions").classList.toggle("hidden", mode !== "host");
      });

      document.getElementById("createGameButton").addEventListener("click", createGame);
    }

    function createGame() {
      const wantedPlayers = Number(document.getElementById("playersCount").value || 5);
      const wantedSpies = Number(document.getElementById("spiesCount").value || 1);
      const wantedMinutes = Number(document.getElementById("roundMinutes").value || 8);
      const mode = document.getElementById("gameMode").value;

      const playersCount = Math.max(3, Math.min(20, wantedPlayers));
      const spiesCount = Math.max(1, Math.min(playersCount - 1, wantedSpies));
      const minutes = Math.max(1, Math.min(60, wantedMinutes));

      const hero = mode === "host"
        ? document.getElementById("selectedHero").value
        : randomItem(heroes);

      const location = mode === "host"
        ? document.getElementById("selectedLocation").value
        : randomItem(locations);

      const roles = Array(playersCount).fill(false);

      shuffle(roles.map((_, index) => index))
        .slice(0, spiesCount)
        .forEach(function(index) {
          roles[index] = true;
        });

      game = {
        playersCount: playersCount,
        spiesCount: spiesCount,
        minutes: minutes,
        hero: hero,
        location: location,
        roles: roles,
        currentPlayer: 0
      };

      vibrate("success");
      renderPassScreen();
    }

    function renderPassScreen() {
      if (!game) {
        renderHome();
        return;
      }

      const playerNumber = game.currentPlayer + 1;
      const isLastPlayer = playerNumber === game.playersCount;

      app.innerHTML = `
        <div class="wrap">
          <h1>🕵️ Раздача ролей</h1>

          <div class="card">
            <div class="player-number">Игрок ${playerNumber}</div>

            <p class="muted" style="text-align:center">
              Убедись, что остальные не смотрят на экран.
            </p>

            <button class="hold-button" id="holdRoleButton">
              Нажми и удерживай,<br>чтобы увидеть свою роль
            </button>

            <div class="status small">
              После просмотра отпусти кнопку. Роль снова скроется.
            </div>

            <button class="btn alt" id="nextPlayerButton" disabled>
              ${isLastPlayer ? "🚀 Все роли розданы" : "Передать игроку " + (playerNumber + 1)}
            </button>
          </div>

          <button class="btn danger" id="cancelGameButton">Отменить игру</button>
        </div>
      `;

      const holdButton = document.getElementById("holdRoleButton");
      const nextButton = document.getElementById("nextPlayerButton");
      let wasOpened = false;

      function showRole() {
        holdButton.classList.add("holding");

        if (game.roles[game.currentPlayer]) {
          holdButton.innerHTML = "🕵️<br>ТЫ ШПИОН";
        } else {
          holdButton.innerHTML = `
            🛡️<br>
            ${escapeHtml(game.hero)}<br>
            <span style="font-size:15px">Локация: ${escapeHtml(game.location)}</span>
          `;
        }

        vibrate("impact");
      }

      function hideRole() {
        holdButton.classList.remove("holding");
        holdButton.innerHTML = "Нажми и удерживай,<br>чтобы увидеть свою роль";

        if (!wasOpened) {
          wasOpened = true;
          nextButton.disabled = false;
        }
      }

      holdButton.addEventListener("pointerdown", function(event) {
        event.preventDefault();
        holdButton.setPointerCapture(event.pointerId);
        showRole();
      });

      holdButton.addEventListener("pointerup", function(event) {
        event.preventDefault();
        hideRole();
      });

      holdButton.addEventListener("pointercancel", hideRole);
      holdButton.addEventListener("lostpointercapture", hideRole);

      nextButton.addEventListener("click", function() {
        if (!wasOpened) return;

        vibrate("success");

        if (game.currentPlayer < game.playersCount - 1) {
          game.currentPlayer += 1;
          renderPassScreen();
        } else {
          renderRoundScreen();
        }
      });

      document.getElementById("cancelGameButton").addEventListener("click", function() {
        if (confirm("Точно отменить текущую игру?")) {
          game = null;
          renderHome();
        }
      });
    }

    function renderRoundScreen() {
      if (!game) {
        renderHome();
        return;
      }

      const totalSeconds = game.minutes * 60;

      app.innerHTML = `
        <div class="wrap">
          <h1>🕵️ Игра началась</h1>

          <div class="card">
            <h2 class="ok">Роли розданы</h2>
            <p class="muted">
              Задавайте друг другу вопросы. Игроки знают героя и локацию, а шпионы пытаются это выяснить.
            </p>

            <div class="timer" id="timer">${formatTime(totalSeconds)}</div>

            <button class="btn" id="startTimerButton">▶️ Запустить таймер</button>
            <button class="btn alt" id="pauseTimerButton" disabled>⏸️ Пауза</button>
            <button class="btn yellow" id="finishGameButton">🏁 Завершить игру</button>
          </div>

          <div class="card">
            <h2>Важно</h2>
            <p class="muted">
              Не называйте героя и локацию прямо — иначе шпиону будет слишком легко.
            </p>
          </div>

          <button class="btn danger" id="cancelGameButton">Отменить игру</button>
        </div>
      `;

      let secondsLeft = totalSeconds;
      let isRunning = false;

      const timerElement = document.getElementById("timer");
      const startButton = document.getElementById("startTimerButton");
      const pauseButton = document.getElementById("pauseTimerButton");

      function updateTimer() {
        timerElement.textContent = formatTime(secondsLeft);

        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          isRunning = false;
          timerElement.classList.add("finished");
          startButton.disabled = true;
          pauseButton.disabled = true;
          vibrate("error");

          setTimeout(function() {
            alert("Время вышло! Обсудите и выберите предполагаемого шпиона.");
          }, 100);
        }
      }

      function startTimer() {
        if (isRunning || secondsLeft <= 0) return;

        isRunning = true;
        startButton.disabled = true;
        pauseButton.disabled = false;

        timerInterval = setInterval(function() {
          secondsLeft -= 1;
          updateTimer();
        }, 1000);
      }

      function pauseTimer() {
        if (!isRunning) return;

        clearInterval(timerInterval);
        isRunning = false;
        startButton.disabled = false;
        pauseButton.disabled = true;
      }

      startButton.addEventLi
