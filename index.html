<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Dota2SpyForSolin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#0b0d12;
  --bg2:#121722;
  --card:rgba(28,33,45,.96);
  --card2:rgba(15,19,28,.98);
  --line:rgba(255,209,102,.18);
  --line-strong:rgba(255,209,102,.55);
  --text:#f7f8fb;
  --muted:#aeb4c0;
  --gold:#ffd166;
  --green:#76e5a2;
  --red:#ff7b7b;
  --blue:#7ec8ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 5%,rgba(111,82,34,.26),transparent 34%),
    radial-gradient(circle at 85% 15%,rgba(53,75,135,.22),transparent 32%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  font-family:Arial,Helvetica,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.wrap{
  width:min(650px,100%);
  margin:auto;
  padding:18px 14px calc(34px + env(safe-area-inset-bottom));
}

h1{
  margin:8px 0 18px;
  color:#fff7df;
  font-size:28px;
  letter-spacing:.2px;
}

h2{
  margin:0 0 10px;
  font-size:21px;
}

h3{
  margin:0 0 8px;
  font-size:17px;
}

p{
  line-height:1.45;
}

.hidden{
  display:none!important;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.home-title{
  margin:17px 0 5px;
  color:#fff4d2;
  font-size:31px;
  font-weight:900;
  letter-spacing:.5px;
  text-align:center;
  text-shadow:0 2px 18px rgba(255,209,102,.25);
}

.home-subtitle{
  margin:0 0 22px;
  color:#aeb4c0;
  font-size:13px;
  text-align:center;
}

.card{
  position:relative;
  margin:12px 0;
  padding:17px;
  overflow:hidden;
  background:linear-gradient(145deg,rgba(35,40,53,.97),rgba(19,23,32,.97));
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.22);
}

.card:before{
  position:absolute;
  top:0;
  right:12%;
  left:12%;
  height:1px;
  content:"";
  background:linear-gradient(90deg,transparent,rgba(255,209,102,.5),transparent);
}

.btn{
  width:100%;
  min-height:50px;
  margin-top:10px;
  padding:14px 15px;
  color:#17120a;
  background:linear-gradient(135deg,#ffe29a,#f2b94f);
  border:0;
  border-radius:14px;
  box-shadow:0 6px 16px rgba(232,173,57,.16);
  font-weight:800;
}

.btn.alt{
  color:#edf0f7;
  background:#313846;
  box-shadow:none;
}

.btn.danger{
  color:#fff;
  background:linear-gradient(135deg,#b23d3d,#7a2222);
  box-shadow:none;
}

.btn.green{
  color:#061b0e;
  background:linear-gradient(135deg,#a2f7bd,#54cf88);
}

.btn.blue{
  color:#071925;
  background:linear-gradient(135deg,#b8e7ff,#65baf4);
}

.btn.yellow{
  color:#251a00;
  background:linear-gradient(135deg,#ffe29a,#ffc13e);
}

.btn:disabled{
  opacity:.45;
  cursor:default;
}

label{
  display:block;
  margin:12px 0 6px;
  color:#d7dce6;
  font-size:14px;
  font-weight:700;
}

input,select{
  width:100%;
  padding:13px;
  color:#f5f7fb;
  background:#10141d;
  border:1px solid #49515f;
  border-radius:12px;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,209,102,.11);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mode{
  position:relative;
  min-height:145px;
  padding:15px 8px;
  overflow:hidden;
  color:#fff;
  background:linear-gradient(145deg,#242b39,#151a24);
  border:1px solid rgba(255,209,102,.2);
  border-radius:18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  font-weight:800;
}

.mode:after{
  position:absolute;
  right:-20px;
  bottom:-25px;
  width:70px;
  height:70px;
  content:"";
  background:radial-gradient(circle,rgba(255,209,102,.12),transparent 70%);
}

.mode:hover{
  border-color:var(--line-strong);
}

.mode .ico{
  display:block;
  margin-bottom:9px;
  font-size:42px;
}

.mode small{
  display:block;
  margin-top:7px;
  color:#adb6c5;
  font-size:12px;
  font-weight:400;
  line-height:1.3;
}

.selected{
  background:linear-gradient(145deg,#4a3b1a,#241f15)!important;
  border-color:var(--gold)!important;
  box-shadow:0 0 0 2px rgba(255,209,102,.1),inset 0 1px 0 rgba(255,255,255,.1)!important;
}

.box{
  margin-top:14px;
  padding:14px;
  background:rgba(12,15,22,.6);
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
}

.player{
  margin:10px 0 14px;
  color:var(--gold);
  font-size:31px;
  font-weight:900;
  text-align:center;
  text-shadow:0 2px 12px rgba(255,209,102,.22);
}

.secret{
  width:100%;
  min-height:155px;
  margin-top:12px;
  padding:18px;
  color:#fff;
  background:linear-gradient(145deg,#353b48,#202530);
  border:2px solid #5a6372;
  border-radius:19px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  font-size:19px;
  font-weight:800;
  line-height:1.4;
  touch-action:none;
  user-select:none;
}

.peace{
  color:#082513;
  background:linear-gradient(145deg,#b3f9cb,#63d990);
  border-color:#d0ffdf;
}

.spy{
  color:#2b1e00;
  background:linear-gradient(145deg,#ffe8a8,#f3ba43);
  border-color:#fff0bd;
}

.timer{
  margin:18px 0;
  color:var(--green);
  font-size:56px;
  font-weight:900;
  letter-spacing:2px;
  text-align:center;
  text-shadow:0 0 20px rgba(118,229,162,.18);
}

.timer.finished{
  color:var(--red);
  text-shadow:0 0 20px rgba(255,123,123,.24);
}

.status{
  margin:12px 0;
  padding:12px;
  color:#d8ecff;
  background:linear-gradient(145deg,#112a3d,#10202e);
  border:1px solid #28516b;
  border-radius:13px;
  line-height:1.4;
  text-align:center;
}

.result{
  padding:16px;
  text-align:center;
  background:rgba(11,14,20,.68);
  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;
}

.role{
  margin-bottom:7px;
  font-size:56px;
  text-align:center;
}

.preview{
  display:block;
  width:154px;
  height:105px;
  margin:10px auto 12px;
  object-fit:cover;
  background:#111;
  border:1px solid rgba(255,209,102,.52);
  border-radius:13px;
  box-shadow:0 6px 18px rgba(0,0,0,.45);
}

.preview.item{
  padding:11px;
  object-fit:contain;
  background:radial-gradient(circle,#373542,#101218);
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  margin-top:8px;
}

.gcard{
  position:relative;
  min-height:91px;
  padding:3px;
  overflow:hidden;
  color:#fff;
  background:linear-gradient(145deg,#303745,#11151d);
  border:1px solid rgba(255,209,102,.42);
  border-radius:10px;
  box-shadow:0 2px 7px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  font-size:9px;
  font-weight:800;
  line-height:1.05;
  text-align:center;
}

.gcard:active{
  border-color:#fff0a3;
  filter:brightness(1.18);
  transform:scale(.94);
}

.pic{
  display:block;
  width:100%;
  height:56px;
  margin:auto;
  object-fit:cover;
  background:#252525;
  border:1px solid rgba(255,209,102,.24);
  border-radius:7px;
}

.item .pic{
  padding:4px;
  object-fit:contain;
  background:radial-gradient(circle,#34323a,#101010);
}

.gcard span{
  position:absolute;
  right:2px;
  bottom:2px;
  left:2px;
  display:flex;
  min-height:23px;
  align-items:center;
  justify-content:center;
  padding:2px;
  overflow:hidden;
  background:linear-gradient(transparent,rgba(0,0,0,.95) 40%);
  border-radius:0 0 7px 7px;
  text-shadow:0 1px 3px #000;
}

.gcard.crossed{
  opacity:.35;
  border-color:#c54c4c;
  filter:grayscale(.8);
}

.gcard.crossed:before,
.gcard.crossed:after{
  position:absolute;
  z-index:3;
  top:50%;
  left:-15%;
  width:130%;
  height:4px;
  content:"";
  background:#ff6262;
  border:1px solid rgba(255,255,255,.45);
  border-radius:99px;
  box-shadow:0 0 7px rgba(255,70,70,.9);
}

.gcard.crossed:before{
  transform:rotate(35deg);
}

.gcard.crossed:after{
  transform:rotate(-35deg);
}

.build-items{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}

.build-item{
  min-width:0;
  padding:7px 4px;
  color:#eef0f6;
  background:#10141c;
  border:1px solid rgba(255,209,102,.24);
  border-radius:11px;
  font-size:10px;
  font-weight:700;
  line-height:1.15;
  text-align:center;
}

.build-item img{
  display:block;
  width:52px;
  height:52px;
  margin:0 auto 5px;
  padding:3px;
  object-fit:contain;
  background:radial-gradient(circle,#34323a,#101010);
  border-radius:7px;
}

.quiz-top{
  padding:12px;
  text-align:center;
  background:rgba(10,13,19,.55);
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
}

.quiz-progress{
  margin:12px 0 7px;
  color:var(--gold);
  font-size:14px;
  font-weight:800;
  text-align:center;
}

.quiz-score{
  margin-bottom:10px;
  color:#c9d2e1;
  font-size:13px;
  text-align:center;
}

.quiz-answer{
  min-height:104px;
  padding:13px 8px;
  color:#fff;
  background:linear-gradient(145deg,#242b39,#151a24);
  border:2px solid #454f60;
  border-radius:16px;
  font-weight:800;
}

.quiz-answer.good{
  color:#082513;
  background:linear-gradient(145deg,#b3f9cb,#63d990);
  border-color:#d0ffdf;
}

.quiz-answer.bad{
  color:#fff;
  background:linear-gradient(145deg,#aa3d3d,#6d2222);
  border-color:#ff9b9b;
}

.quiz-info{
  margin:10px 0;
  color:#c4cbd7;
  font-size:13px;
  line-height:1.4;
  text-align:center;
}

.rules-block{
  margin:12px 0;
  padding:13px;
  background:rgba(10,13,19,.55);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
}

.rules-block h3{
  color:var(--gold);
}

.easter-egg{
  margin:24px 4px 3px;
  color:rgba(255,209,102,.5);
  font-size:11px;
  font-style:italic;
  line-height:1.4;
  text-align:center;
}

.loading{
  display:flex;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,209,102,.18),transparent 32%),
    linear-gradient(180deg,#151b29,#090b10);
}

.loading-box{
  width:min(330px,100%);
  padding:30px 22px;
  text-align:center;
  background:rgba(24,29,40,.94);
  border:1px solid rgba(255,209,102,.25);
  border-radius:22px;
  box-shadow:0 18px 45px rgba(0,0,0,.35);
}

.loading-logo{
  margin-bottom:12px;
  color:#fff3d2;
  font-size:28px;
  font-weight:900;
  text-shadow:0 0 18px rgba(255,209,102,.25);
}

.loading-text{
  margin-bottom:20px;
  color:#aeb4c0;
  font-size:14px;
}

.spinner{
  width:36px;
  height:36px;
  margin:auto;
  border:4px solid rgba(255,209,102,.2);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

.err{
  margin:20px;
  padding:16px;
  color:#ffe4e4;
  background:#3b1717;
  border:1px solid #f07a7a;
  border-radius:15px;
}

.tiny-note{
  margin-top:8px;
  color:#788190;
  font-size:10px;
  text-align:center;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:360px){
  .cards{
    gap:4px;
  }

  .gcard{
    min-height:78px;
    padding:2px;
    font-size:8px;
  }

  .pic{
    height:48px;
  }

  .gcard span{
    min-height:19px;
    padding:1px;
  }

  .mode{
    min-height:130px;
  }
}
</style>
</head>

function esc(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function rnd(array){
  return array[Math.floor(Math.random()*array.length)];
}

function mix(array){
  var result=array.slice();

  for(var i=result.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var temp=result[i];
    result[i]=result[j];
    result[j]=temp;
  }

  return result;
}

function img(object,type){
  return "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/"+
    (type==="heroes"?"heroes/":"items/")+
    object.slug+
    ".png";
}

function formatTime(seconds){
  return String(Math.floor(seconds/60)).padStart(2,"0")+":"+
    String(seconds%60).padStart(2,"0");
}

function haptic(type){
  try{
    if(!window.Telegram||!Telegram.WebApp||!Telegram.WebApp.HapticFeedback){
      return;
    }

    if(type==="light"){
      Telegram.WebApp.HapticFeedback.impactOccurred("light");
    }else if(type==="medium"){
      Telegram.WebApp.HapticFeedback.impactOccurred("medium");
    }else if(type==="heavy"){
      Telegram.WebApp.HapticFeedback.impactOccurred("heavy");
    }else if(type==="success"){
      Telegram.WebApp.HapticFeedback.notificationOccurred("success");
    }else if(type==="error"){
      Telegram.WebApp.HapticFeedback.notificationOccurred("error");
    }else if(type==="warning"){
      Telegram.WebApp.HapticFeedback.notificationOccurred("warning");
    }
  }catch(error){}
}

function setupTelegram(){
  try{
    if(window.Telegram&&Telegram.WebApp){
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  }catch(error){}
}

function startSpyGame(){
  var players=Math.max(3,Math.min(20,Number(document.getElementById("playersCount").value)||5));
  var spies=Math.max(1,Math.min(players-1,Number(document.getElementById("spiesCount").value)||1));
  var minutes=Math.max(1,Math.min(60,Number(document.getElementById("minutesCount").value)||8));
  var peacefulCard;
  var spyCard;
  var location="";

  if(spyType==="heroes"){
    if(spyMode==="host"){
      peacefulCard=document.getElementById("peacefulHero").value;
      spyCard=document.getElementById("spyHero").value;
      location=document.getElementById("location").value;

      if(peacefulCard===spyCard){
        alert("Выбери разных героев для мирных и шпионов.");
        return;
      }
    }else{
      peacefulCard=rnd(heroes).name;

      do{
        spyCard=rnd(heroes).name;
      }while(spyCard===peacefulCard);

      location=rnd([
        "Таверна",
        "Рошанова яма",
        "Мид-лейн",
        "Лес Radiant",
        "Лес Dire",
        "Фонтан Radiant",
        "Фонтан Dire",
        "Секретный магазин",
        "Лагерь древних крипов"
      ]);
    }
  }else{
    if(spyMode==="host"){
      peacefulCard=items.filter(function(item){
        return item.slug===document.getElementById("peacefulItem").value;
      })[0];

      spyCard=items.filter(function(item){
        return item.slug===document.getElementById("spyItem").value;
      })[0];

      if(peacefulCard.slug===spyCard.slug){
        alert("Выбери разные предметы для мирных и шпионов.");
        return;
      }
    }else{
      peacefulCard=rnd(items);

      do{
        spyCard=rnd(items);
      }while(spyCard.slug===peacefulCard.slug);
    }
  }

  spyGame={
    type:spyType,
    mode:spyMode,
    timer:timerMode,
    players:players,
    minutes:minutes,
    peacefulCard:peacefulCard,
    spyCard:spyCard,
    location:location,
    spies:mix(Array.from({length:players},function(_,index){
      return index;
    })).slice(0,spies),
    current:0
  };

  spyRoleScreen();
}

function spyRoleScreen(){
  var playerNumber=spyGame.current+1;
  var isSpy=spyGame.spies.indexOf(spyGame.current)!==-1;
  var isLast=playerNumber===spyGame.players;

  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Шпион</h1>'+
      '<div class="card">'+
        '<div class="player">Игрок '+playerNumber+'</div>'+
        '<p class="muted small" style="text-align:center">Остальные игроки не должны смотреть на экран.</p>'+
        '<button id="secretCard" class="secret">Нажми и удерживай,<br>чтобы увидеть карточку</button>'+
        '<button id="nextPlayer" class="btn alt" disabled>'+
          (isLast?"🚀 Начать игру":"Передать игроку "+(playerNumber+1))+
        '</button>'+
      '</div>'+
      '<button id="cancelSpy" class="btn danger">Отменить игру</button>'+
    '</div>';

  var secretButton=document.getElementById("secretCard");
  var nextButton=document.getElementById("nextPlayer");
  var opened=false;
  var hasSeen=false;

  function secretName(){
    var secret=isSpy?spyGame.spyCard:spyGame.peacefulCard;
    return spyGame.type==="heroes"?secret:secret.name;
  }

  function showCard(){
    if(opened){
      return;
    }

    opened=true;
    hasSeen=true;

    var name=secretName();

    if(spyGame.mode==="hidden"){
      secretButton.classList.add("spy");
      secretButton.innerHTML=
        '🔒<br>Секретная карточка<br>'+
        '<span style="font-size:18px">'+esc(name)+'</span>'+
        (spyGame.type==="heroes"
          ?'<br><span style="font-size:14px">Локация: '+esc(spyGame.location)+'</span>'
          :"");
    }else{
      secretButton.classList.add(isSpy?"spy":"peace");
      secretButton.innerHTML=
        (isSpy?"🕵️<br>ТЫ ШПИОН":"🛡️<br>ТЫ МИРНЫЙ")+
        '<br><span style="font-size:18px">'+esc(name)+'</span>'+
        (spyGame.type==="heroes"
          ?'<br><span style="font-size:14px">Локация: '+esc(spyGame.location)+'</span>'
          :"");
    }

    haptic("medium");
  }

  function hideCard(){
    if(!opened){
      return;
    }

    opened=false;
    secretButton.classList.remove("spy","peace");
    secretButton.innerHTML="Нажми и удерживай,<br>чтобы увидеть карточку";
    nextButton.disabled=false;
  }

  secretButton.onpointerdown=function(event){
    event.preventDefault();
    showCard();
  };

  secretButton.onpointerup=function(event){
    event.preventDefault();
    hideCard();
  };

  secretButton.onpointerleave=hideCard;
  secretButton.onpointercancel=hideCard;

  nextButton.onclick=function(){
    if(!hasSeen){
      return;
    }

    haptic("light");

    if(spyGame.current<spyGame.players-1){
      spyGame.current++;
      spyRoleScreen();
    }else{
      spyPlayScreen();
    }
  };

  document.getElementById("cancelSpy").onclick=function(){
    haptic("warning");
    home();
  };
}

function spyPlayScreen(){
  var timed=spyGame.timer==="withTime";
  var seconds=spyGame.minutes*60;

  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Шпион</h1>'+
      '<div class="card">'+
        '<h2>Игра началась</h2>'+
        '<p class="muted">'+
          (spyGame.mode==="hidden"
            ?"Карточки разные, но роли скрыты. Никто не знает, кто шпион."
            :"Задавайте вопросы, обсуждайте карточки и ищите шпионов.")+
        '</p>'+
        '<div id="spyTimer" class="timer">'+(timed?formatTime(seconds):"∞")+'</div>'+
        (timed?'<button id="timerButton" class="btn">▶️ Запустить таймер</button>':'<div class="status">♾️ Игра без времени</div>')+
        '<button id="finishSpy" class="btn yellow">🏁 Закончить раунд</button>'+
      '</div>'+
      '<button id="cancelSpy" class="btn danger">Отменить игру</button>'+
    '</div>';

  if(timed){
    var running=false;
    var timer=document.getElementById("spyTimer");
    var timerButton=document.getElementById("timerButton");

    timerButton.onclick=function(){
      haptic("light");

      if(running){
        clearInterval(timerId);
        running=false;
        timerButton.textContent="▶️ Продолжить таймер";
        return;
      }

      if(seconds<=0){
        return;
      }

      running=true;
      timerButton.textContent="⏸️ Пауза";

      timerId=setInterval(function(){
        seconds--;
        timer.textContent=formatTime(seconds);

        if(seconds<=0){
          clearInterval(timerId);
          timer.classList.add("finished");
          timerButton.disabled=true;
          haptic("heavy");
        }
      },1000);
    };
  }

  document.getElementById("finishSpy").onclick=function(){
    haptic("medium");
    spyResultScreen();
  };

  document.getElementById("cancelSpy").onclick=function(){
    haptic("warning");
    home();
  };
}

function toggleGuessCard(index){
  var list=guessGame.crossed[guessGame.active-1];
  var exists=list.indexOf(index);

  if(exists===-1){
    list.push(index);
    haptic("light");

    var selectedCard=guessGame.cards[index];
    var enemySecret=guessGame.active===1
      ?guessGame.secondSecret
      :guessGame.firstSecret;

    if(selectedCard.slug===enemySecret.slug){
      haptic("success");
      guessResultScreen(guessGame.active);
      return;
    }
  }else{
    list.splice(exists,1);
    haptic("light");
  }

  guessBoardScreen();
}

        '<h2>Выбери сложность</h2>'+
        '<div class="grid2">'+
          '<button id="easyQuiz" class="mode"><span class="ico">🟢</span>Лёгкая<small>Имя и портрет, без таймера</small></button>'+
          '<button id="mediumQuiz" class="mode"><span class="ico">🟡</span>Средняя<small>Только портрет, 15 секунд</small></button>'+
          '<button id="hardQuiz" class="mode"><span class="ico">🔴</span>Сложная<small>Описание и выбор героя, 10 секунд</small></button>'+
          '<button id="backHome" class="mode"><span class="ico">⬅️</span>Назад<small>В главное меню</small></button>'+
        '</div>'+
      '</div>'+
    '</div>';

  document.getElementById("easyQuiz").onclick=function(){
    haptic("light");
    startQuiz("easy");
  };

  document.getElementById("mediumQuiz").onclick=function(){
    haptic("light");
    startQuiz("medium");
  };

  document.getElementById("hardQuiz").onclick=function(){
    haptic("light");
    startQuiz("hard");
  };

  document.getElementById("backHome").onclick=function(){
    haptic("light");
    home();
  };
}

function startQuiz(difficulty){
  quizGame={
    difficulty:difficulty,
    questions:mix(heroes).slice(0,10),
    index:0,
    score:0,
    locked:false,
    timeLeft:difficulty==="medium"?15:(difficulty==="hard"?10:0)
  };

  quizQuestionScreen();
}

function quizDifficultyName(){
  if(quizGame.difficulty==="easy"){
    return "Лёгкая";
  }

  if(quizGame.difficulty==="medium"){
    return "Средняя";
  }

  return "Сложная";
}

function pointsForQuiz(){
  if(quizGame.difficulty==="easy"){
    return 1;
  }

  if(quizGame.difficulty==="medium"){
    return 2;
  }

  return 3;
}

function quizQuestionScreen(){
  clearInterval(quizTimerId);

  var hero=quizGame.questions[quizGame.index];
  var options;

  quizGame.locked=false;
  quizGame.timeLeft=quizGame.difficulty==="medium"?15:(quizGame.difficulty==="hard"?10:0);

  if(quizGame.difficulty==="hard"){
    var wrongHeroes=mix(
      heroes.filter(function(otherHero){
        return otherHero.slug!==hero.slug;
      })
    ).slice(0,3);

    options=mix([hero].concat(wrongHeroes));
  }else{
    options=mix(["Сила","Ловкость","Интеллект","Универсальный"]);
  }

  var content="";

  if(quizGame.difficulty==="easy"){
    content=
      '<div class="quiz-top">'+
        '<img class="preview" src="'+img(hero,"heroes")+'" alt="">'+
        '<h2>'+esc(hero.name)+'</h2>'+
        '<p class="quiz-info">Какой у этого героя главный атрибут?</p>'+
      '</div>';
  }

  if(quizGame.difficulty==="medium"){
    content=
      '<div class="quiz-top">'+
        '<img class="preview" src="'+img(hero,"heroes")+'" alt="">'+
        '<p class="quiz-info">Определи главный атрибут героя по портрету.</p>'+
        '<div id="quizTimer" class="timer" style="font-size:38px;margin:7px 0">'+quizGame.timeLeft+'с</div>'+
      '</div>';
  }

  if(quizGame.difficulty==="hard"){
    content=
      '<div class="quiz-top">'+
        '<div class="role">❔</div>'+
        '<h2>Кто это?</h2>'+
        '<p class="quiz-info">'+esc(hero.style)+'</p>'+
        '<div id="quizTimer" class="timer" style="font-size:38px;margin:7px 0">'+quizGame.timeLeft+'с</div>'+
      '</div>';
  }

  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Угадай по атрибуту</h1>'+
      '<div class="quiz-progress">Вопрос '+(quizGame.index+1)+' из 10 · '+quizDifficultyName()+'</div>'+
      '<div class="quiz-score">Очки: '+quizGame.score+'</div>'+
      '<div class="card">'+
        content+
        '<div class="grid2" style="margin-top:12px">'+
          options.map(function(option){
            var answerValue=quizGame.difficulty==="hard"?option.slug:option;
            var answerText=quizGame.difficulty==="hard"?option.name:option;

            return '<button class="quiz-answer" data-answer="'+
              esc(answerValue)+'">'+
              esc(answerText)+
              '</button>';
          }).join("")+
        '</div>'+
        '<button id="nextQuiz" class="btn green hidden">Следующий вопрос</button>'+
        '<button id="cancelQuiz" class="btn alt">← Выйти из викторины</button>'+
      '</div>'+
    '</div>';

  document.querySelectorAll("[data-answer]").forEach(function(button){
    button.onclick=function(){
      checkQuizAnswer(button.dataset.answer,hero);
    };
  });

  document.getElementById("nextQuiz").onclick=function(){
    haptic("light");
    quizGame.index++;

    if(quizGame.index>=10){
      quizResultScreen();
    }else{
      quizQuestionScreen();
    }
  };

  document.getElementById("cancelQuiz").onclick=function(){
    haptic("warning");
    clearInterval(quizTimerId);
    quizDifficulty();
  };

  if(quizGame.difficulty!=="easy"){
    quizTimerId=setInterval(function(){
      if(quizGame.locked){
        return;
      }

      quizGame.timeLeft--;

      var timer=document.getElementById("quizTimer");

      if(timer){
        timer.textContent=quizGame.timeLeft+"с";
      }

      if(quizGame.timeLeft<=0){
        clearInterval(quizTimerId);
        quizGame.locked=true;
        haptic("heavy");

        var correctValue=quizGame.difficulty==="hard"
          ?hero.slug
          :hero.attr;

        var correctText=quizGame.difficulty==="hard"
          ?hero.name
          :hero.attr;

        document.querySelectorAll("[data-answer]").forEach(function(button){
          button.disabled=true;

          if(button.dataset.answer===correctValue){
            button.classList.add("good");
            button.textContent="✅ "+correctText;
          }
        });

        document.getElementById("nextQuiz").classList.remove("hidden");
      }
    },1000);
  }
}

function checkQuizAnswer(answer,hero){
  if(quizGame.locked){
    return;
  }

  quizGame.locked=true;
  clearInterval(quizTimerId);

  var correct=quizGame.difficulty==="hard"
    ?answer===hero.slug
    :answer===hero.attr;

  var correctValue=quizGame.difficulty==="hard"
    ?hero.slug
    :hero.attr;

  var correctText=quizGame.difficulty==="hard"
    ?hero.name
    :hero.attr;

  document.querySelectorAll("[data-answer]").forEach(function(button){
    button.disabled=true;

    if(button.dataset.answer===correctValue){
      button.classList.add("good");
      button.textContent="✅ "+correctText;
    }

    if(button.dataset.answer===answer&&!correct){
      button.classList.add("bad");
      button.textContent="❌ "+button.textContent;
    }
  });

  if(correct){
    quizGame.score+=pointsForQuiz();
    haptic("success");
  }else{
    haptic("error");
  }

  document.getElementById("nextQuiz").classList.remove("hidden");
}

function quizResultScreen(){
  clearInterval(quizTimerId);

  var maxScore=10*pointsForQuiz();
  var percent=Math.round((quizGame.score/maxScore)*100);
  var rank="Начинающий игрок";

  if(percent>=90){
    rank="Легенда Dota2SpyForSolin";
  }else if(percent>=70){
    rank="Знаток героев";
  }else if(percent>=40){
    rank="Хорошее знание Dota";
  }

  app.innerHTML=
    '<div class="wrap">'+
      '<h1>Результат викторины</h1>'+
      '<div class="card">'+
        '<div class="result">'+
          '<div class="role">'+(percent>=70?"🏆":"⭐")+'</div>'+
          '<h2>'+esc(rank)+'</h2>'+
          '<p class="muted">Сложность: '+esc(quizDifficultyName())+'</p>'+
          '<div class="timer" style="font-size:44px;margin:12px 0">'+quizGame.score+' / '+maxScore+'</div>'+
          '<p class="muted">Правильность: '+percent+'%</p>'+
        '</div>'+
        '<button id="againQuiz" class="btn green">🔄 Играть ещё раз</button>'+
        '<button id="quizMenu" class="btn alt">← К выбору сложности</button>'+
        '<button id="homeAfterQuiz" class="btn alt">🏠 В главное меню</button>'+
      '</div>'+
    '</div>';

  if(percent>=70){
    haptic("success");
  }else{
    haptic("medium");
  }

  document.getElementById("againQuiz").onclick=function(){
    haptic("light");
    startQuiz(quizGame.difficulty);
  };

  document.getElementById("quizMenu").onclick=function(){
    haptic("light");
    quizDifficulty();
  };

  document.getElementById("homeAfterQuiz").onclick=function(){
    haptic("light");
    home();
  };
}

setupTelegram();

setTimeout(function(){
  home();
},700);
</script>
</body>
</html>
