<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spy Dota 2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const heroes=["Pudge","Invoker","Juggernaut","Crystal Maiden","Axe","Mirana","Phantom Assassin","Drow Ranger","Earthshaker","Lina","Shadow Fiend","Sven","Rubick","Sniper","Tidehunter","Zeus","Anti-Mage","Queen of Pain","Storm Spirit","Lich"];
const locations=["Таверна","Рошанова яма","Мид-лейн","Лес Radiant","Лес Dire","Фонтан Radiant","Фонтан Dire","Секретный магазин","Лагерь Древних"];
const A=document.getElementById("app"); let state=JSON.parse(localStorage.spyDota||"null");
function save(){localStorage.spyDota=JSON.stringify(state)}
function render(){if(!state)return home(); if(state.screen==="setup")setup(); else if(state.screen==="room")room(); else if(state.screen==="play")play(); else if(state.screen==="result")result()}
function home(){A.innerHTML=`<div class=wrap><h1>🕵️ Spy: Dota 2</h1><div class=card><h2>Новая игра</h2><button class=btn onclick="newGame('auto')">🎲 Классическая — роли автоматически</button><button class="btn alt" onclick="newGame('host')">👑 Ведущий — сам выбирает героев</button><p class=muted>Онлайн-комнаты рассчитаны на запуск через backend. Эта сборка также умеет играть локально на одном устройстве.</p></div></div>`}
function newGame(mode){state={screen:"setup",mode,players:5,spies:1,room:Math.random().toString(36).slice(2,8).toUpperCase(),hero:heroes[0],location:locations[0],selected:[],names:[]};save();render()}
function setup(){A.innerHTML=`<div class=wrap><div class=top><h1>Настройка</h1><span class=muted>${state.mode==="host"?"👑 Ведущий":"🎲 Авто"}</span></div><div class=card><label>Игроков</label><input id=n type=number min=3 max=12 value=${state.players}><label>Шпионов</label><select id=s><option>1</option><option>2</option><option>3</option></select>${state.mode==="host"?`<h3>Выбор героев</h3><div id=heroes>${heroes.map((h,i)=>`<label class=hero><input type=radio name=h value="${i}" ${i===0?"checked":""}> <b>${h}</b></label>`).join("")}</div><p class=muted>Ведущий выбирает персонажа/персонажей для раунда.</p>`:""}<button class=btn onclick="startLocal()">Создать комнату</button><button class="btn alt" onclick="state=null;save();render()">Назад</button></div></div>`}
function startLocal(){state.players=+n.value;state.spies=+s.value;state.hero=state.mode==="host"?heroes[+document.querySelector('input[name=h]:checked').value]:heroes[Math.floor(Math.random()*heroes.length)];state.location=locations[Math.floor(Math.random()*locations.length)];state.spySet=[];while(state.spySet.length<state.spies){let x=Math.floor(Math.random()*state.players);if(!state.spySet.includes(x))state.spySet.push(x)}state.current=0;state.screen="room";save();render()}
function room(){A.innerHTML=`<div class=wrap><h1>Комната</h1><div class=card><div class=muted>КОД КОМНАТЫ</div><div class=code>${state.room}</div><div class=center><span class=pill>${state.players} игроков</span><span class=pill>${state.spies} шпион(ов)</span></div><button class=btn onclick="showRole()">▶️ Начать раздачу ролей</button><button class="btn alt" onclick="state=null;save();render()">Выйти</button></div><div class=card><h3>Как играть</h3><p>Передайте телефон игрокам по очереди. Ведущий не должен показывать экран с чужой ролью.</p></div></div>`}
function showRole(){state.screen="play";save();render()}
function play(){let spy=state.spySet.includes(state.current);A.innerHTML=`<div class=wrap><div class=card center><div class=muted>ИГРОК ${state.current+1} / ${state.players}</div><div class=role>${spy?"🕵️":"🎴"}</div><h2>${spy?"Вы — ШПИОН":"Вы — МИРНЫЙ ИГРОК"}</h2><p>${spy?"Постарайтесь понять локацию, не выдав себя.":"Вы знаете локацию. Не называйте её прямо и вычислите шпиона."}</p><div class=card>${spy?"Локация неизвестна":`📍 ${state.location}<br>🎭 ${state.hero}`}</div><button class=btn onclick="nextRole()">Скрыть и передать</button></div></div>`}
function nextRole(){if(state.current<state.players-1){state.current++;save();render()}else{state.screen="result";save();render()}}
function result(){A.innerHTML=`<div class=wrap><h1>🏆 Раунд окончен</h1><div class=card><h2>Ответ</h2><p>📍 Локация: <b>${state.location}</b></p><p>🎭 Герой: <b>${state.hero}</b></p><p>🕵️ Шпионов: <b>${state.spies}</b></p></div><button class=btn onclick="state=null;save();render()">Новая игра</button></div>`}
render();
</script></body></html>
