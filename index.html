<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Dota2SpyForSolin</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    :root {
      --bg: #101010;
      --card: #1d1d1f;
      --card2: #151515;
      --line: #3a3a3a;
      --text: #ffffff;
      --muted: #aaaaaa;
      --green: #76e5a2;
      --yellow: #ffd166;
      --red: #ff7b7b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .wrap {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 18px 14px calc(36px + env(safe-area-inset-bottom));
    }

    h1 {
      margin: 8px 0 18px;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    p {
      line-height: 1.45;
    }

    .card {
      margin: 12px 0;
      padding: 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      color: #111;
      background: #fff;
      font-weight: 700;
    }

    .btn.alt {
      color: #fff;
      background: #303035;
    }

    .btn.danger {
      color: #fff;
      background: #a83131;
    }

    .btn.yellow {
      color: #211700;
      background: var(--yellow);
    }

    .btn:disabled {
      cursor: default;
      opacity: 0.45;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #d0d0d0;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      color: #fff;
      background: #111;
      border: 1px solid #4a4a4a;
      border-radius: 12px;
      outline: none;
    }

    .game-type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .game-type-button {
      min-height: 140px;
      padding: 15px 8px;
      color: #fff;
      background: var(--card2);
      border: 2px solid #45454b;
      border-radius: 18px;
      font-weight: 700;
    }

    .game-type-button.selected {
      border-color: var(--yellow);
      background: #332d19;
    }

    .game-type-icon {
      display: block;
      margin-bottom: 8px;
      font-size: 46px;
    }

    .game-type-subtitle {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
    }

    .mode-card {
      margin-top: 10px;
      padding: 14px;
      background: var(--card2);
      border: 1px solid #45454a;
      border-radius: 14px;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      max-height: 420px;
      overflow-y: auto;
    }

    .item-button {
      min-width: 0;
      min-height: 108px;
      padding: 7px 4px;
      color: #fff;
      background: #101010;
      border: 2px solid #414146;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }

    .item-button.selected-peaceful {
      border-color: var(--green);
    }

    .item-button.selected-spy {
      border-color: var(--yellow);
    }

    .item-icon {
      display: block;
      width: 54px;
      height: 54px;
      margin: 0 auto 6px;
      object-fit: contain;
      image-rendering: auto;
    }

    .choice-info {
      margin-top: 10px;
      padding: 10px;
      background: #101010;
      border-radius: 11px;
      color: #d5d5d5;
      font-size: 13px;
      line-height: 1.45;
    }

    .player-number {
      margin: 12px 0 16px;
      color: var(--yellow);
      font-size: 32px;
      font-weight: 800;
      text-align: center;
    }

    .secret-button {
      width: 100%;
      min-height: 155px;
      margin-top: 12px;
      padding: 18px;
      color: #fff;
      background: #35353a;
      border: 2px solid #53535a;
      border-radius: 18px;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.4;
      user-select: none;
      touch-action: none;
    }

    .secret-button.open-peaceful {
      color: #06180d;
      background: var(--green);
      border-color: #b2ffd0;
    }

    .secret-button.open-spy {
      color: #211700;
      background: var(--yellow);
      border-color: #ffe39b;
    }

    .role-item-icon {
      display: block;
      width: 76px;
      height: 76px;
      margin: 12px auto 0;
      object-fit: contain;
    }

    .timer {
      margin: 20px 0;
      color: var(--green);
      font-size: 58px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .timer.finished {
      color: var(--red);
    }

    .result {
      padding: 16px;
      text-align: center;
      background: var(--card2);
      border-radius: 14px;
    }

    .result-item-icon {
      display: block;
      width: 90px;
      height: 90px;
      margin: 12px auto;
      object-fit: contain;
    }

    .role-icon {
      margin: 8px 0;
      font-size: 58px;
      text-align: center;
    }

    .peaceful-title {
      color: var(--green);
    }

    .spy-title {
      color: var(--yellow);
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const app = document.getElementById("app");

    const heroes = [
      "Abaddon", "Alchemist", "Ancient Apparition", "Anti-Mage",
      "Axe", "Bane", "Batrider", "Beastmaster", "Bloodseeker",
      "Bounty Hunter", "Bristleback", "Broodmother", "Chaos Knight",
      "Clinkz", "Clockwerk", "Crystal Maiden", "Dazzle", "Doom",
      "Dragon Knight", "Drow Ranger", "Earthshaker", "Ember Spirit",
      "Enchantress", "Enigma", "Faceless Void", "Gyrocopter", "Huskar",
      "Invoker", "Jakiro", "Juggernaut", "Kunkka", "Legion Commander",
      "Lich", "Lifestealer", "Lina", "Lion", "Luna", "Magnus", "Mars",
      "Medusa", "Meepo", "Mirana", "Monkey King", "Morphling", "Muerta",
      "Naga Siren", "Nature's Prophet", "Necrophos", "Night Stalker",
      "Nyx Assassin", "Ogre Magi", "Omniknight", "Oracle", "Pangolier",
      "Phantom Assassin", "Phantom Lancer", "Phoenix", "Puck", "Pudge",
      "Pugna", "Queen of Pain", "Razor", "Riki", "Rubick", "Sand King",
      "Shadow Demon", "Shadow Fiend", "Shadow Shaman", "Silencer",
      "Skywrath Mage", "Slardar", "Slark", "Snapfire", "Sniper",
      "Spectre", "Spirit Breaker", "Storm Spirit", "Sven", "Techies",
      "Templar Assassin", "Terrorblade", "Tidehunter", "Tinker", "Tiny",
      "Treant Protector", "Troll Warlord", "Tusk", "Undying", "Ursa",
      "Venomancer", "Viper", "Visage", "Void Spirit", "Warlock", "Weaver",
      "Windranger", "Winter Wyvern", "Witch Doctor", "Wraith King", "Zeus"
    ];

    const items = [
      { name: "Aghanim's Scepter", slug: "ultimate_scepter" },
      { name: "Aghanim's Shard", slug: "aghanims_shard" },
      { name: "Arcane Boots", slug: "arcane_boots" },
      { name: "Armlet", slug: "armlet" },
      { name: "Assault Cuirass", slug: "assault" },
      { name: "Battle Fury", slug: "bfury" },
      { name: "Black King Bar", slug: "black_king_bar" },
      { name: "Blink Dagger", slug: "blink" },
      { name: "Bloodthorn", slug: "bloodthorn" },
      { name: "Boots of Travel", slug: "travel_boots" },
      { name: "Bottle", slug: "bottle" },
      { name: "Butterfly", slug: "butterfly" },
      { name: "Crimson Guard", slug: "crimson_guard" },
      { name: "Daedalus", slug: "greater_crit" },
      { name: "Dagon", slug: "dagon" },
      { name: "Desolator", slug: "desolator" },
      { name: "Diffusal Blade", slug: "diffusal_blade" },
      { name: "Divine Rapier", slug: "rapier" },
      { name: "Dragon Lance", slug: "dragon_lance" },
      { name: "Ethereal Blade", slug: "ethereal_blade" },
      { name: "Eye of Skadi", slug: "skadi" },
      { name: "Force Staff", slug: "force_staff" },
      { name: "Gleipnir", slug: "gungir" },
      { name: "Guardian Greaves", slug: "guardian_greaves" },
      { name: "Hand of Midas", slug: "hand_of_midas" },
      { name: "Heart of Tarrasque", slug: "heart" },
      { name: "Heaven's Halberd", slug: "heavens_halberd" },
      { name: "Hurricane Pike", slug: "hurricane_pike" },
      { name: "Kaya", slug: "kaya" },
      { name: "Linken's Sphere", slug: "sphere" },
      { name: "Lotus Orb", slug: "lotus_orb" },
      { name: "Manta Style", slug: "manta" },
      { name: "Mask of Madness", slug: "mask_of_madness" },
      { name: "Meteor Hammer", slug: "meteor_hammer" },
      { name: "Mjollnir", slug: "mjollnir" },
      { name: "Monkey King Bar", slug: "monkey_king_bar" },
      { name: "Moon Shard", slug: "moon_shard" },
      { name: "Nullifier", slug: "nullifier" },
      { name: "Octarine Core", slug: "octarine_core" },
      { name: "Orchid Malevolence", slug: "orchid" },
      { name: "Overwhelming Blink", slug: "overwhelming_blink" },
      { name: "Pipe of Insight", slug: "pipe" },
      { name: "Power Treads", slug: "power_treads" },
      { name: "Radiance", slug: "radiance" },
      { name: "Refresher Orb", slug: "refresher" },
      { name: "Rod of Atos", slug: "rod_of_atos" },
      { name: "Sange and Yasha", slug: "sange_and_yasha" },
      { name: "Satanic", slug: "satanic" },
      { name: "Scythe of Vyse", slug: "sheepstick" },
      { name: "Shadow Blade", slug: "invis_sword" },
      { name: "Shiva's Guard", slug: "shivas_guard" },
      { name: "Silver Edge", slug: "silver_edge" },
      { name: "Solar Crest", slug: "solar_crest" },
      { name: "Spirit Vessel", slug: "spirit_vessel" },
      { name: "Vanguard", slug: "vanguard" },
      { name: "Veil of Discord", slug: "veil_of_discord" },
      { name: "Wind Waker", slug: "wind_waker" },
      { name: "Witch Blade", slug: "witch_blade" }
    ];

    const locations = [
      "Таверна",
      "Рошанова яма",
      "Мид-лейн",
      "Лес Radiant",
      "Лес Dire",
      "Фонтан Radiant",
      "Фонтан Dire",
      "Секретный магазин",
      "Лагерь Древних"
    ];

    let game = null;
    let timerId = null;
    let selectedGameType = "heroes";
    let selectedMode = "random";
    let hostPeacefulChoice = null;
    let hostSpyChoice = null;
    let hostPickerTarget = "peaceful";

    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (error) {
      console.log(error);
    }

    function randomItem(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function shuffle(list) {
      const result = list.slice();

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temporary = result[i];
        result[i] = result[j];
        result[j] = temporary;
      }

      return result;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function haptic(type) {
      try {
        const tg = window.Telegram && window.Telegram.WebApp;

        if (!tg || !tg.HapticFeedback) {
          return;
        }

        if (type === "success") {
          tg.HapticFeedback.notificationOccurred("success");
        } else if (type === "error") {
          tg.HapticFeedback.notificationOccurred("error");
        } else {
          tg.HapticFeedback.impactOccurred("medium");
        }
      } catch (error) {
        console.log(error);
      }
    }

    function itemImage(item) {
      return "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/" +
        item.slug +
        ".png";
    }

    function getTypeTitle() {
      return selectedGameType === "heroes" ? "Герои" : "Предметы";
    }

    function renderHome() {
      clearInterval(timerId);

      hostPeacefulChoice = null;
      hostSpyChoice = null;
      hostPickerTarget = "peaceful";

      app.innerHTML = `
        <div class="wrap">
          <h1>🕵️ Dota2SpyForSolin</h1>

          <div class="card">
            <h2>Выбери мини-игру</h2>

            <div class="game-type-grid">
              <button id="heroesButton" class="game-type-button">
                <span class="game-type-icon">🦸</span>
                Герои
                <span class="game-type-subtitle">Герой и локация</span>
              </button>

              <button id="itemsButton" class="game-type-button">
                <span class="game-type-icon">🗡️</span>
                Предметы
                <span class="game-type-subtitle">Предмет без локаций</span>
              </button>
            </div>
          </div>

          <div class="card">
            <h2 id="settingsTitle"></h2>

            <label for="gameMode">Режим игры</label>
            <select id="gameMode">
              <option value="random">🎲 Рандом</option>
              <option value="host">🎙️ С ведущим</option>
            </select>

            <div id="modeText" class="mode-card small muted"></div>

            <label for="playersCount">Количество игроков</label>
            <input id="playersCount" type="number" min="3" max="20" value="5">

            <label for="spiesCount">Количество шпионов</label>
            <input id="spiesCount" type="number" min="1" max="5" value="1">

            <label for="minutesCount">Время игры в минутах</label>
            <input id="minutesCount" type="number" min="1" max="60" value="8">

            <div id="hostSettings" class="hidden"></div>

            <button id="startGameButton" class="btn">🎮 Начать раздачу ролей</button>
          </div>
        </div>
      `;

      document.getElementById("heroesButton").addEventListener("click", function() {
        selectedGameType = "heroes";
        renderHome();
      });

      document.getElementById("itemsButton").addEventListener("click", function() {
        selectedGameType = "items";
        renderHome();
      });

      document.getElementById("gameMode").value = selectedMode;

      document.getElementById("gameMode").addEventListener("change", function() {
        selectedMode = document.getElementById("gameMode").value;
        hostPeacefulChoice = null;
        hostSpyChoice = null;
        hostPickerTarget = "peaceful";
        updateHome();
      });

      document.getElementById("startGameButton").addEventListener("click", createGame);

      updateHome();
    }

    function updateHome() {
      const heroesButton = document.getElementById("heroesButton");
      const itemsButton = document.getElementById("itemsButton");
      const title = document.getElementById("settingsTitle");
      const modeText = document.getElementById("modeText");
      const hostSettings = document.getElementById("hostSettings");

      heroesButton.classList.toggle("selected", selectedGameType === "heroes");
      itemsButton.classList.toggle("selected", selectedGameType === "items");

      title.textContent = "Настройки: " + getTypeTitle();

      if (selectedMode === "random") {
        modeText.textContent = selectedGameType === "heroes"
          ? "Игра сама выберет героя мирных, героя шпионов и локацию."
          : "Игра сама выберет предмет мирных и другой предмет шпионов.";

        hostSettings.innerHTML = "";
        hostSettings.classList.add("hidden");
      } else {
        modeText.textContent = selectedGameType === "heroes"
          ? "Ведущий выбирает героев списком. Портреты героев отключены для быстрой работы."
          : "Ведущий выбирает предметы маленькими иконками.";

        hostSettings.classList.remove("hidden");
        renderHostSettings();
      }
    }

    function renderHostSettings() {
      const hostSettings = document.getElementById("hostSettings");

      if (selectedGameType === "heroes") {
        hostSettings.innerHTML = `
          <div class="mode-card">
            <h2>Выбор ведущего</h2>

            <label for="peacefulHero">Герой мирных</label>
            <select id="peacefulHero">
              ${heroes.map(function(hero) {
                return `<option value="${escapeHtml(hero)}">${escapeHtml(hero)}</option>`;
              }).join("")}
            </select>

            <label for="spyHero">Герой шпионов</label>
            <select id="spyHero">
              ${heroes.map(function(hero) {
                return `<option value="${escapeHtml(hero)}">${escapeHtml(hero)}</option>`;
              }).join("")}
            </select>

            <label for="locationSelect">Общая локация</label>
            <select id="locationSelect">
              ${locations.map(function(location) {
                return `<option value="${escapeHtml(location)}">${escapeHtml(location)}</option>`;
              }).join("")}
            </select>
          </div>
        `;

        return;
      }

      renderItemPicker();
    }

    function renderItemPicker() {
      const hostSettings = document.getElementById("hostSettings");
      const currentChoice = hostPickerTarget === "peaceful"
        ? hostPeacefulChoice
        : hostSpyChoice;

      const title = hostPickerTarget === "peaceful"
        ? "🛡️ Выбери предмет мирных"
        : "🕵️ Выбери предмет шпионов";

      const selectedClass = hostPickerTarget === "peaceful"
        ? "selected-peaceful"
        : "selected-spy";

      const itemButtons = items.map(function(item, index) {
        const isSelected = currentChoice && currentChoice.slug === item.slug;

        return `
          <button
            class="item-button ${isSelected ? selectedClass : ""}"
            data-item-index="${index}"
          >
            <img
              class="item-icon"
              src="${itemImage(item)}"
              alt=""
              loading="lazy"
            >
            ${escapeHtml(item.name)}
          </button>
        `;
      }).join("");

      hostSettings.innerHTML = `
        <div class="mode-card">
          <h2>Выбор ведущего</h2>

          <div class="choice-info">
            Мирные: <b>${escapeHtml(hostPeacefulChoice ? hostPeacefulChoice.name : "не выбрано")}</b><br>
            Шпионы: <b>${escapeHtml(hostSpyChoice ? hostSpyChoice.name : "не выбрано")}</b>
          </div>

          <p class="small">${title}</p>

          <div class="item-grid">
            ${itemButtons}
          </div>

          ${hostPickerTarget === "spy" ? `
            <button id="backToPeacefulButton" class="btn alt">
              ← Изменить предмет мирных
            </button>
          ` : ""}
        </div>
      `;

      document.querySelectorAll("[data-item-index]").forEach(function(button) {
        button.addEventListener("click", function() {
          const item = items[Number(button.dataset.itemIndex)];

          if (hostPickerTarget === "peaceful") {
            hostPeacefulChoice = item;
            hostPickerTarget = "spy";
          } else {
            hostSpyChoice = item;
          }

          haptic("impact");
          renderItemPicker();
        });
      });

      const backButton = document.getElementById("backToPeacefulButton");

      if (backButton) {
        backButton.addEventListener("click", function() {
          hostPickerTarget = "peaceful";
          renderItemPicker();
        });
      }
    }

    function createGame() {
      const playersInput = Number(document.getElementById("players
