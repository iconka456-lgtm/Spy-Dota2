<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Dota2SpyForSolin</title>

  <script>
    window.addEventListener("error", function(event) {
      document.addEventListener("DOMContentLoaded", function() {
        var app = document.getElementById("app");

        if (app) {
          app.innerHTML =
            "<div style='font-family:Arial;padding:20px;color:white;background:#101010;min-height:100vh'>" +
            "<h2>Ошибка JavaScript</h2>" +
            "<pre style='white-space:pre-wrap;color:#ff7777'>" +
            String(event.message) +
            "
Строка: " + event.lineno +
            "
Файл: " + event.filename +
            "</pre>" +
            "</div>";
        }
      });
    });

    window.addEventListener("unhandledrejection", function(event) {
      var app = document.getElementById("app");

      if (app) {
        app.innerHTML =
          "<div style='font-family:Arial;padding:20px;color:white;background:#101010;min-height:100vh'>" +
          "<h2>Ошибка загрузки</h2>" +
          "<pre style='white-space:pre-wrap;color:#ff7777'>" +
          String(event.reason?.message || event.reason || "Неизвестная ошибка") +
          "</pre>" +
          "</div>";
      }
    });
  </script>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: white;
      background: #101010;
      font-family: Arial, sans-serif;
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    .card {
      padding: 18px;
      margin-top: 14px;
      border: 1px solid #393939;
      border-radius: 16px;
      background: #1d1d1f;
    }

    .btn {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      color: #111;
      background: white;
      font-weight: bold;
    }

    .btn.alt {
      color: white;
      background: #333;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid #555;
      border-radius: 10px;
      color: white;
      background: #111;
    }

    .muted {
      color: #aaa;
    }

    .error {
      color: #ff7777;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="wrap">
      <h1>🕵️ Dota2SpyForSolin</h1>
      <div class="card">
        Загрузка...
      </div>
    </div>
  </div>

  <script>
    var app = document.getElementById("app");

    function screenError(text) {
      app.innerHTML =
        "<div class='wrap'>" +
        "<h1>🕵️ Dota2SpyForSolin</h1>" +
        "<div class='card'>" +
        "<h2>Ошибка</h2>" +
        "<div class='error'>" + String(text).replace(/</g, "&lt;") + "</div>" +
        "</div>" +
        "</div>";
    }

    try {
      if (!window.supabase || !window.supabase.createClient) {
        throw new Error(
          "Supabase не загрузился. Проверь интернет, затем полностью закрой Telegram и открой приложение снова."
        );
      }

      var SUPABASE_URL = "https://hyvcpcwoxxcuhjgrhars.supabase.co";
      var SUPABASE_KEY = "sb_publishable_EPkobMICKNonO148D6QmHA_8I6gJdPy";

      var db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: false,
            autoRefreshToken: false,
            detectSessionInUrl: false
          }
        }
      );

      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      } catch (telegramError) {}

      app.innerHTML =
        "<div class='wrap'>" +
        "<h1>🕵️ Dota2SpyForSolin</h1>" +
        "<div class='card'>" +
        "<h2 class='muted'>Приложение загрузилось</h2>" +
        "<p>Если ты видишь этот экран — чёрный экран исправлен.</p>" +
        "<input id='testCode' placeholder='Тестовый код комнаты'>" +
        "<button class='btn' onclick='testSupabase()'>Проверить подключение к Supabase</button>" +
        "<div id='result' class='muted' style='margin-top:12px'></div>" +
        "</div>" +
        "</div>";

      window.testSupabase = async function() {
        var result = document.getElementById("result");
        result.textContent = "Проверяю подключение...";

        try {
          var response = await db
            .from("rooms")
            .select("id")
            .limit(1);

          if (response.error) {
            throw response.error;
          }

          result.innerHTML =
            "<span style='color:#76e5a2'>✅ Supabase подключён. Таблица rooms доступна.</span>";
        } catch (error) {
          result.innerHTML =
            "<span style='color:#ff7777'>❌ Ошибка Supabase: " +
            String(error.message || error) +
            "</span>";
        }
      };

    } catch (error) {
      console.error(error);
      screenError(error.message || error);
    }
  </script>
</body>
</html>
