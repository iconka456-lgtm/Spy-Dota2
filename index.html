    * { box-sizing: border-box; }

    body {

      color: var(--text);

    }

    button, input, select { font: inherit; }

    p { line-height: 1.45; }

    .card {

      padding: 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .center { text-align: center; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .ok { color: var(--green); }
    .warn { color: var(--yellow); }
    .error { color: var(--red); white-space: pre-wrap; line-height: 1.45; }
    .hidden { display: none !important; }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: #ffffff;
      color: #111111;
      font-weight: 700;
    }

    .btn.alt {
      background: #2b2b2f;
      color: #ffffff;
    }

    .btn.danger {
      background: #a83131;
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    label {
      display: block;
      margin: 11px 0 5px;
      color: #c6c6c6;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #444;
      border-radius: 12px;
      outline: none;
      background: #101010;
      color: #ffffff;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .code {
      margin: 12px 0 18px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 7px;
    }

    .pill {

      background: #2a2a2d;
      font-size: 14px;

      border-radius: 12px;
      background: var(--card2);
      color: #b8b8b8;
      line-height: 1.4;

    .players {

    .player {

      background: var(--card2);

    .spy-choice {

      padding: 10px;
