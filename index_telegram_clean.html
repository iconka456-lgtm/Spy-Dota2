<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Spy: Dota 2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div><script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const heroes=["Abaddon", "Alchemist", "Ancient Apparition", "Anti-Mage", "Arc Warden", "Axe", "Bane", "Batrider", "Beastmaster", "Bloodseeker", "Bounty Hunter", "Brewmaster", "Bristleback", "Broodmother", "Centaur Warrunner", "Chaos Knight", "Chen", "Clinkz", "Clockwerk", "Crystal Maiden", "Dark Seer", "Dark Willow", "Dawnbreaker", "Dazzle", "Death Prophet", "Disruptor", "Doom", "Dragon Knight", "Drow Ranger", "Earthshaker", "Earth Spirit", "Elder Titan", "Ember Spirit", "Enchantress", "Enigma", "Faceless Void", "Grimstroke", "Gyrocopter", "Hoodwink", "Huskar", "Invoker", "Jakiro", "Juggernaut", "Keeper of the Light", "Kez", "Kunkka", "Legion Commander", "Leshrac", "Lich", "Lifestealer", "Lina", "Lion", "Lone Druid", "Luna", "Lycan", "Marci", "Magnus", "Mars", "Medusa", "Meepo", "Mirana", "Monkey King", "Morphling", "Muerta", "Naga Siren", "Nature's Prophet", "Necrophos", "Night Stalker", "Nyx Assassin", "Ogre Magi", "Omniknight", "Oracle", "Outworld Destroyer", "Pangolier", "Phantom Assassin", "Phantom Lancer", "Phoenix", "Primal Beast", "Puck", "Pudge", "Pugna", "Queen of Pain", "Razor", "Riki", "Ringmaster", "Rubick", "Sand King", "Shadow Demon", "Shadow Fiend", "Shadow Shaman", "Silencer", "Skywrath Mage", "Slardar", "Slark", "Snapfire", "Sniper", "Spectre", "Spirit Breaker", "Storm Spirit", "Sven", "Techies", "Templar Assassin", "Terrorblade", "Tidehunter", "Timbersaw", "Tinker", "Tiny", "Treant Protector", "Troll Warlord", "Tusk", "Underlord", "Undying", "Ursa", "Vengeful Spirit", "Venomancer", "Viper", "Visage", "Void Spirit", "Warlock", "Weaver", "Windranger", "Winter Wyvern", "Witch Doctor", "Wraith King", "Zeus"];
const heroSlugs={"Abaddon": "abaddon", "Alchemist": "alchemist", "Ancient Apparition": "ancient_apparition", "Anti-Mage": "antimage", "Arc Warden": "arc_warden", "Axe": "axe", "Bane": "bane", "Batrider": "batrider", "Beastmaster": "beastmaster", "Bloodseeker": "bloodseeker", "Bounty Hunter": "bounty_hunter", "Brewmaster": "brewmaster", "Bristleback": "bristleback", "Broodmother": "broodmother", "Centaur Warrunner": "centaur", "Chaos Knight": "chaos_knight", "Chen": "chen", "Clinkz": "clinkz", "Clockwerk": "rattletrap", "Crystal Maiden": "crystal_maiden", "Dark Seer": "dark_seer", "Dark Willow": "dark_willow", "Dawnbreaker": "dawnbreaker", "Dazzle": "dazzle", "Death Prophet": "death_prophet", "Disruptor": "disruptor", "Doom": "doom_bringer", "Dragon Knight": "dragon_knight", "Drow Ranger": "drow_ranger", "Earthshaker": "earthshaker", "Earth Spirit": "earth_spirit", "Elder Titan": "elder_titan", "Ember Spirit": "ember_spirit", "Enchantress": "enchantress", "Enigma": "enigma", "Faceless Void": "faceless_void", "Grimstroke": "grimstroke", "Gyrocopter": "gyrocopter", "Hoodwink": "hoodwink", "Huskar": "huskar", "Invoker": "invoker", "Jakiro": "jakiro", "Juggernaut": "juggernaut", "Keeper of the Light": "keeper_of_the_light", "Kez": "kez", "Kunkka": "kunkka", "Legion Commander": "legion_commander", "Leshrac": "leshrac", "Lich": "lich", "Lifestealer": "life_stealer", "Lina": "lina", "Lion": "lion", "Lone Druid": "lone_druid", "Luna": "luna", "Lycan": "lycan", "Marci": "marci", "Magnus": "magnataur", "Mars": "mars", "Medusa": "medusa", "Meepo": "meepo", "Mirana": "mirana", "Monkey King": "monkey_king", "Morphling": "morphling", "Muerta": "muerta", "Naga Siren": "naga_siren", "Nature's Prophet": "furion", "Necrophos": "necrolyte", "Night Stalker": "night_stalker", "Nyx Assassin": "nyx_assassin", "Ogre Magi": "ogre_magi", "Omniknight": "omniknight", "Oracle": "oracle", "Outworld Destroyer": "obsidian_destroyer", "Pangolier": "pangolier", "Phantom Assassin": "phantom_assassin", "Phantom Lancer": "phantom_lancer", "Phoenix": "phoenix", "Primal Beast": "primal_beast", "Puck": "puck", "Pudge": "pudge", "Pugna": "pugna", "Queen of Pain": "queenofpain", "Razor": "razor", "Riki": "riki", "Ringmaster": "ringmaster", "Rubick": "rubick", "Sand King": "sand_king", "Shadow Demon": "shadow_demon", "Shadow Fiend": "nevermore", "Shadow Shaman": "shadow_shaman", "Silencer": "silencer", "Skywrath Mage": "skywrath_mage", "Slardar": "slardar", "Slark": "slark", "Snapfire": "snapfire", "Sniper": "sniper", "Spectre": "spectre", "Spirit Breaker": "spirit_breaker", "Storm Spirit": "storm_spirit", "Sven": "sven", "Techies": "techies", "Templar Assassin": "templar_assassin", "Terrorblade": "terrorblade", "Tidehunter": "tidehunter", "Timbersaw": "timbersaw", "Tinker": "tinker", "Tiny": "tiny", "Treant Protector": "treant", "Troll Warlord": "troll_warlord", "Tusk": "tusk", "Underlord": "abyssal_underlord", "Undying": "undying", "Ursa": "ursa", "Vengeful Spirit": "vengefulspirit", "Venomancer": "venomancer", "Viper": "viper", "Visage": "visage", "Void Spirit": "void_spirit", "Warlock": "warlock", "Weaver": "weaver", "Windranger": "windrunner", "Winter Wyvern": "winter_wyvern", "Witch Doctor": "witch_doctor", "Wraith King": "skeleton_king", "Zeus": "zuus"};
const locations=["Таверна", "Рошанова яма", "Мид-лейн", "Лес Radiant", "Лес Dire", "Фонтан Radiant", "Фонтан Dire", "Секретный магазин", "Лагерь Древних"];
const A=document.getElementById('app');
let state=JSON.parse(localStorage.spyDota||'null');
function save(){localStorage.spyDota=JSON.stringify(state)}
function img(h){return 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/'+heroSlugs[h]+'.png'}
function render(){if(!state)return home(); if(state.screen==='setup')setup(); else if(state.screen==='room')room(); else if(state.screen==='play')play(); else if(state.screen==='result')result()}
function home(){A.innerHTML=`<div class="wrap"><h1>🕵️ Spy: Dota 2</h1><div class="card"><h2>Новая игра</h2><button class="btn" onclick="newGame('auto')">🎲 Классическая — роли автоматически</button><button class="btn alt" onclick="newGame('host')">👑 Ведущий — сам выбирает героя</button><p class="muted">125 героев Dota 2. Игра рассчитана на передачу одного телефона игрокам по очереди.</p></div></div>`}
function newGame(mode){state={screen:'setup',mode,players:5,spies:1,room:Math.random().toString(36).slice(2,8).toUpperCase(),hero:heroes[0],location:locations[0],current:0};save();render()}
function heroCard(h,i){return `<button type="button" class="hero-card ${state.hero===h?'selected':''}" onclick="pickHero(${i})"><img src="${img(h)}" alt="${h}" loading="lazy" onerror="this.style.visibility='hidden'"><span>${h}</span></button>`}
function pickHero(i){state.hero=heroes[i];save();document.querySelectorAll('.hero-card').forEach(x=>x.classList.remove('selected'));document.querySelectorAll('.hero-card')[i]?.classList.add('selected')}
function filterHeroes(){const q=(document.getElementById('heroSearch')?.value||'').toLowerCase(); document.querySelectorAll('.hero-card').forEach(c=>c.style.display=c.dataset.name.includes(q)?'':'none')}
function setup(){A.innerHTML=`<div class="wrap"><div class="top"><h1>Настройка</h1><span class="muted">${state.mode==='host'?'👑 Ведущий':'🎲 Авто'}</span></div><div class="card"><label>Игроков</label><input id="n" type="number" min="3" max="12" value="${state.players}"><label>Шпионов</label><select id="s"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>${state.mode==='host'?`<h3>Выбери героя</h3><input id="heroSearch" class="search" placeholder="🔎 Поиск героя..." oninput="filterHeroes()"><div class="hero-grid">${heroes.map((h,i)=>heroCard(h,i).replace('hero-card ','hero-card '+(state.hero===h?'selected ':'')).replace('<button type="button"','<button data-name="'+h.toLowerCase().replace(/'/g,'&#39;')+'" type="button"')).join('')}</div>`:`<div class="card mini"><b>🎭 Герой</b><p class="muted">Герой будет выбран случайно из всех 125.</p></div>`}<button class="btn" onclick="startLocal()">Создать комнату</button><button class="btn alt" onclick="state=null;save();render()">Назад</button></div></div>`}
function startLocal(){state.players=Math.max(3,Math.min(12,+document.getElementById('n').value||5));state.spies=+document.getElementById('s').value; if(state.mode!=='host')state.hero=heroes[Math.floor(Math.random()*heroes.length)];state.location=locations[Math.floor(Math.random()*locations.length)];state.spySet=[];while(state.spySet.length<state.spies){let x=Math.floor(Math.random()*state.players);if(!state.spySet.includes(x))state.spySet.push(x)}state.current=0;state.screen='room';save();render()}
function room(){A.innerHTML=`<div class="wrap"><h1>Комната</h1><div class="card"><div class="muted">КОД КОМНАТЫ</div><div class="code">${state.room}</div><div class="center"><span class="pill">${state.players} игроков</span><span class="pill">${state.spies} шпион(ов)</span></div><button class="btn" onclick="showRole()">▶️ Начать раздачу ролей</button><button class="btn alt" onclick="state=null;save();render()">Выйти</button></div><div class="card"><h3>Как играть</h3><p>Передавайте телефон игрокам по очереди. Каждый смотрит только свою роль.</p></div></div>`}
function showRole(){state.screen='play';save();render()}
function play(){let spy=state.spySet.includes(state.current);A.innerHTML=`<div class="wrap"><div class="card center"><div class="muted">ИГРОК ${state.current+1} / ${state.players}</div><div class="role">${spy?'🕵️':'🎴'}</div><h2>${spy?'Вы — ШПИОН':'Вы — МИРНЫЙ ИГРОК'}</h2><p>${spy?'Постарайтесь понять локацию, не выдав себя.':'Вы знаете локацию. Не называйте её прямо и вычислите шпиона.'}</p><div class="secret">${spy?'Локация неизвестна':`<div class="hero-secret"><img src="${img(state.hero)}" onerror="this.style.visibility='hidden'"><div>📍 ${state.location}</div><b>🎭 ${state.hero}</b></div>`}</div><button class="btn" onclick="nextRole()">Скрыть и передать</button></div></div>`}
function nextRole(){if(state.current<state.players-1){state.current++;save();render()}else{state.screen='result';save();render()}}
function result(){A.innerHTML=`<div class="wrap"><h1>🏆 Раунд окончен</h1><div class="card center"><div class="hero-secret big"><img src="${img(state.hero)}" onerror="this.style.visibility='hidden'"><p>📍 ${state.location}</p><b>🎭 ${state.hero}</b></div><p>🕵️ Шпионов: <b>${state.spies}</b></p></div><button class="btn" onclick="state=null;save();render()">Новая игра</button></div>`}
render();
</script></body></html>
